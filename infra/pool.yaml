# 인프라 풀 — 작업 지시(P7)가 **할당받는** 자원 목록.
#
# 프로비저닝은 "만드는 것"이 아니라 **"준비된 것을 꺼내 쓰는 것"** 이다.
# 하드웨어·OS 설치는 사람이 미리 해 두고 여기 등록한다. 그래서:
#
#   · 에이전트가 클라우드 크레덴셜을 쥘 필요가 없다 (과금 발생 행동 없음)
#   · 실패 모드가 "생성 실패"가 아니라 "가용 자원 없음" — 훨씬 다루기 쉽다
#   · 회수 = 반납이지 삭제가 아니다
#
# 등급(kind)
#   container  이 호스트의 도커. el34 존 네트워크에 붙는다. 여기 등록하지 않는다
#              (도커가 곧 풀이다 — capacity 만 아래 limits 로 잡는다)
#   vm         외부 시스템의 가상머신. L2 로 연결돼 있다
#   server     외부 시스템의 전용 서버. L2 로 연결돼 있다
#
# 존 매핑 주의 — 컨테이너는 도커 브리지(10.20.30~40.0/24), 외부 호스트는 물리 LAN
# (192.168.0.0/24) 이다. 같은 존 이름을 쓰더라도 **L3 경로가 다르다.** 외부 호스트가
# 컨테이너 존에 닿아야 하면 이 호스트를 경유하는 라우팅이 필요하다 (미해결 — Q10).
# 그때까지 컨테이너 존을 외부 장비에 요구하면 **거부한다** — 닿지도 않는 자원을
# 잡아 두면 작업이 조용히 실패한다.
#
# ── 이 파일은 사람의 것이다 ────────────────────────────────────────────────
# 여기 적는 것은 **재고**다: 어떤 장비가 있고, 사람이 보기에 쓸 수 있는가(status).
# **할당 상태는 여기 안 적는다.** 작업이 돌 때마다 이 파일을 고치면 주석과 포맷이
# 날아간다. 누가 무엇을 잡고 있는지는 원장(`var/infra/allocations.json`)에만 쌓이고,
# 현황은 `dawn-biz infra` 로 본다.

limits:
  # 동시에 띄울 수 있는 작업 컨테이너 수. 넘으면 대기시킨다.
  container_max: 6

# ── 작업 컨테이너를 어디에 띄우나 ──────────────────────────────────────────
# 비우면 이 호스트의 로컬 도커. 여기서는 worker 로 보낸다 — .231 은 dawnofagi
# 자신(관제·포털·EG)이 도는 곳이라 작업과 자원을 다투면 관제가 먼저 느려진다.
#
# 원격은 **SSH 로만** 붙는다. 도커 TCP 소켓(2375/2376)은 기본이 무인증이라
# 여는 순간 그 호스트에 대한 무제한 원격 실행이 된다. `.231` 의 키는
# `command="docker system dial-stdio"` 로 묶여 있어 셸을 열지 못한다.
container:
  docker_host: ssh://ccc@192.168.0.203
  host_name: worker (192.168.0.203)

  # **이 호스트에는 존 브리지가 없다.** 존 네트워크(el34-*)는 .231 의 도커
  # 브리지고 worker 는 물리 LAN 에 있다 (Q10 미해결).
  #
  # 그래서 존을 **선언한** 작업은 여기서 거부한다. 존 없이 붙여 놓고 "존에
  # 있다"고 기록하면 게이트도 심각도도 거짓이 된다 — 조용히 틀리느니
  # 시끄럽게 거부하는 편이 낫다. 존이 필요하면 라우팅을 먼저 연다(Q10).
  zone_networks: false

# ── 존 경유 (Q10 — 결정: 호스트 라우팅 · pipe 경유) ────────────────────────
# 외부 장비는 물리 LAN(192.168.0.x), 컨테이너 존은 도커 브리지(10.20.x) 다.
# 둘을 잇는 방법으로 **이 호스트를 게이트웨이로 쓰되 pipe 존을 거치는 것**을 골랐다.
# 오버레이(swarm/VXLAN)는 el34 랩을 건드려야 하고, 존을 분리하면 hand-off 가
# 파일 교환으로 제한된다. 호스트 라우팅은 **pipe 가 PEP 라는 전제를 유지한다**.
#
# **경로를 여는 것은 방화벽 변경이라 사람이 한다** (규칙 2). 절차:
#   1) sudo bash infra/el34/route-external.sh --apply
#   2) 아래 enabled 를 true 로, zones 에 열린 존을 적는다
#   3) dawn-biz infra --retry
#
# 여기 적혀 있는데 실제로 안 열려 있으면 작업이 실패한다 — 그건 시끄러운 실패라
# 조용히 안 닿는 것보다 낫다.
routing:
  enabled: false
  zones: []                # 예: [dmz]  — 외부 장비가 닿을 수 있는 컨테이너 존
  via: pipe                # 반드시 pipe 를 거친다 (존 경계 = 검사 지점)

hosts: []
# 예시 — 실제 장비가 준비되면 사람이 추가한다.
#
# - id: node-01
#   kind: server          # vm | server
#   cpu: 16
#   memory_gb: 64
#   disk_gb: 1000
#   zone: dmz             # 이 호스트가 속한 존 (게이트·심각도 판정에 쓰인다)
#   address: 192.168.0.201
#   os: ubuntu-24.04
#   status: available     # available | maintenance  ← 사람의 판단만 적는다
#   notes: L2 연결. 관제 대상으로 등록 필요.
#
# 등록한 뒤:  dawn-biz infra --retry   ← 준비대기로 멈춰 있던 지시가 이어서 돈다
