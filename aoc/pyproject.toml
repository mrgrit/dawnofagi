[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawn-aoc"
version = "0.1.0"
description = "the dawn of AGI — AOC 관제 시스템 (수집·탐지·트리아지·대응) (P3)"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["dawn-core", "dawn-agents"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
dawn-aoc = "dawn_aoc.cli:main"

[tool.setuptools.packages.find]
include = ["dawn_aoc*"]
