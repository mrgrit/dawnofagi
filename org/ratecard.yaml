# 정산 기준 — 작업 지시 하나가 얼마를 썼는가 (P7 DoD-7).
#
# **원가만 적는다. 청구 단가는 여기 없다** (QUESTIONS Q9-③).
# 고객에게 얼마를 받을지는 계약·사업 판단이고, 여기는 "우리가 얼마를 썼나"다.
# 둘을 한 파일에 섞으면 원가가 곧 견적이 되어 나간다.
#
# ── 0 과 `미정` 은 다르다 ──────────────────────────────────────────────────
#   0      값이 0 이라고 **판단했다**
#   미정   아직 안 정했다. **사용량은 재되 금액은 안 매긴다**
#
# 이 구분이 없으면 "로컬 모델이라 공짜"와 "아직 전기료를 안 따졌다"가 같은 0 으로
# 보이고, 원가가 실제보다 싸게 잡힌다. 정산서는 미정 항목을 따로 세어 보여준다.
#
# ── 종량과 시간을 다르게 잡는다 ───────────────────────────────────────────
# **클라우드는 토큰당, 전용 장비는 시간당.**
#
# 클라우드는 실제로 토큰당 청구되니 토큰이 맞다. 그런데 사내 GPU 는 쓰든 안 쓰든
# 같은 값이 든다 — 토큰당으로 잡으면 **같은 일의 원가가 처리량 편차만큼 흔들린다.**
# 실측(2026-08-02): 같은 `gpt-oss:120b` 가 run 에 따라 3.7 ~ 12.8 tok/s 로 **3.5배**
# 차이가 났다. 토큰당으로 매기면 느린 날의 원가가 3.5배로 잡힌다. 장비는 시간을 산다.

currency: KRW
usd_krw: 1380              # 2026-08-02 기준 개략치. 환율이 바뀌면 여기만 고친다

# ── 종량: 클라우드 모델 (USD / 1M tokens, 공개 API 단가) ─────────────────
model:
  claude-opus-5:    {in_usd_1m: 5.0, out_usd_1m: 25.0}
  claude-opus-4-8:  {in_usd_1m: 5.0, out_usd_1m: 25.0}
  claude-sonnet-5:  {in_usd_1m: 3.0, out_usd_1m: 15.0}
  claude-haiku-4-5: {in_usd_1m: 1.0, out_usd_1m: 5.0}

# ── 시간: 전용 장비 ──────────────────────────────────────────────────────
#
#   시간당 원가 = 구입가 / (수명연수 × 8760) + 소비전력W / 1000 × 전기요금
#
# **아래 셋만 채우면 나머지는 계산된다** (`dawn_biz.records.hourly`).
# 구입가·소비전력은 견적서/전원부 라벨에, 전기요금은 고지서에 있다.
# 하나라도 미정이면 그 장비의 시간당 원가가 미정이 되고, 정산 합계는 **하한**이 된다.
electricity_krw_kwh: 미정  # 산업용 전력 단가 — 한전 고지서에서

hardware:
  gpu-server:              # 사내 GPU 서버 (VPN 너머). 로컬 모델이 여기서 돈다
    구입가: 미정
    수명연수: 5
    소비전력w: 미정
    비고: VRAM 44GB+ 사용 확인 (2026-08-02). 전원부 라벨의 정격 소비전력을 적는다

  container-host:          # 이 호스트. 작업 컨테이너가 여기 뜬다
    구입가: 미정
    수명연수: 5
    소비전력w: 미정
    비고: Intel N150 · 4 코어 · RAM 15GB. 저전력 미니PC 라 GPU 대비 매우 작다

# 로컬 모델 — 위 `gpu-server` 의 시간당 원가를 **점유 시간**에 곱한다.
# 별도 단가를 두지 않는다. 두면 장비 원가와 어긋난다.
gpu_source: gpu-server

# 인프라 점유 — 시간당.
infra_hour:
  none: 0                  # 아무것도 안 잡았다. 진짜 0 이다
  container: container-host   # 이 호스트를 컨테이너 정원으로 나눈다
  vm: 미정                 # 외부 장비. 준비되면 hardware: 에 추가하고 여기서 가리킨다
  server: 미정
