# 정산 기준 — 작업 지시 하나가 얼마를 썼는가 (P7 DoD-7).
#
# **원가만 적는다. 청구 단가는 여기 없다** (QUESTIONS Q9-③ 미정).
# 고객에게 얼마를 받을지는 계약·사업 판단이고, 여기는 "우리가 얼마를 썼나"다.
# 둘을 한 파일에 섞으면 원가가 곧 견적이 되어 나간다.
#
# ── 0 과 `미정` 은 다르다 ──────────────────────────────────────────────────
#   0      값이 0 이라고 **판단했다**
#   미정   아직 안 정했다. **사용량은 재되 금액은 안 매긴다**
#
# 이 구분이 없으면 "로컬 모델이라 공짜"와 "아직 전기료를 안 따졌다"가 같은 0 으로
# 보이고, 원가가 실제보다 싸게 잡힌다. 정산서는 미정 항목을 따로 세어 보여준다.

currency: KRW
usd_krw: 1380              # 2026-08-02 기준 개략치. 환율이 바뀌면 여기만 고친다

# 모델 토큰 — 클라우드는 공개 API 단가(USD / 1M tokens), 로컬은 미정.
model:
  claude-opus-5:    {in_usd_1m: 5.0, out_usd_1m: 25.0}
  claude-opus-4-8:  {in_usd_1m: 5.0, out_usd_1m: 25.0}
  claude-sonnet-5:  {in_usd_1m: 3.0, out_usd_1m: 15.0}
  claude-haiku-4-5: {in_usd_1m: 1.0, out_usd_1m: 5.0}

# 로컬 모델(ollama)의 원가는 GPU 전력 + 감가상각이다. 재무가 산정하기 전까지
# **미정**으로 둔다 — 0 으로 두면 로컬이 공짜라는 잘못된 신호가 KPI 로 간다.
local_model: 미정

# 인프라 점유 — 시간당. 외부 장비의 감가상각·전력·회선을 재무가 정해야 한다.
infra_hour:
  none: 0                  # 아무것도 안 잡았다. 진짜 0 이다
  container: 미정
  vm: 미정
  server: 미정
