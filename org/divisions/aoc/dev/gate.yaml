# AOC 개발부 — 코드를 만드는 팀. 빌드·테스트는 자유, 배포·의존성은 게이트.
tools:
  allow:
    - eg.*
    - skill.*
    - fs.read
    - fs.write
    - net.*
    - sys.run_command
    - dev.git
    - dev.tests
    - sec.trace_query       # 자기가 만든 관제를 조회해 검증
    - doc.*                 # 설계·근거 문서 (P5)
    - proj.*                # 프로젝트·태스크 조율 (P5)
  deny:
    - fin.*
    - hr.*
    - comm.*
    - sec.firewall_change
    - sec.container_stop
    - sec.credential_revoke
    - sys.deploy            # 배포는 별도 경로 (사람)
autonomy: A1
hitl:
  require_on:
    - destructive
    - irreversible
    - deploy
    - external_send
    - dependency_add
budget:
  max_steps: 60
  max_tool_calls: 120
model:
  policy: from_eg
