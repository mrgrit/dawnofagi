[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawn-biz"
version = "0.1.0"
description = "the dawn of AGI — 업무 시스템 (문서·CRM·프로젝트·경리) (P5)"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["dawn-core", "dawn-agents", "dawn-aoc"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
dawn-biz = "dawn_biz.cli:main"

[tool.setuptools.packages.find]
include = ["dawn_biz*"]
