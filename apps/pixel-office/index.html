<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the dawn of AGI — 픽셀 오피스</title>
<style>
  /* 의존성 0. npm 없음, CDN 없음. dawn-aoc serve 가 이 파일 하나를 준다. */
  :root{
    --bg:#070a0e; --panel:#111821; --panel2:#0d141b; --line:#1e2a36; --ink:#d6e2f0;
    --dim:#7d8fa3; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --crit:#dc2626; --acc:#2ab7a9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,"D2Coding",Consolas,monospace}
  #app{display:grid;grid-template-rows:auto 1fr auto;height:100%}

  header{display:flex;align-items:center;gap:12px;padding:8px 14px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0;letter-spacing:.5px;white-space:nowrap}
  header h1 b{color:var(--acc)}
  .crumb{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb a{color:var(--acc);cursor:pointer;text-decoration:none}
  .grow{flex:1}
  .chip{border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--dim);
    white-space:nowrap}
  .chip b{color:var(--ink)}
  .chip.live b{color:var(--ok)}
  button{background:#1b2632;color:var(--ink);border:1px solid var(--line);
    border-radius:3px;padding:4px 9px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--acc)}
  button[disabled]{opacity:.35;cursor:default}
  button.on{border-color:var(--acc);color:var(--acc)}

  main{display:grid;grid-template-columns:1fr 366px;min-height:0}
  #stage{position:relative;min-width:0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 32%,#101820 0%,#070a0e 72%)}
  canvas#cv{display:block;width:100%;height:100%;cursor:grab}
  canvas#cv.drag{cursor:grabbing}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px}

  h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
  h2:first-child{margin-top:0}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:2px 8px;margin-bottom:2px}
  .kv span:first-child{color:var(--dim)}
  .row{padding:5px 0;border-bottom:1px solid #18222c}
  .row:last-child{border-bottom:0}
  .muted{color:var(--dim)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:3px;
    padding:0 5px;margin:1px 3px 1px 0;font-size:11px;color:var(--dim)}
  .tag.pol{border-color:#3b5a7a;color:#8fb6dd}
  .tag.asset{border-color:#3f5f45;color:#8fd6a1}
  .sev-critical{color:var(--crit)} .sev-high{color:var(--bad)}
  .sev-medium{color:var(--warn)} .sev-low{color:var(--ok)}
  .bar{height:4px;background:#1b2632;border-radius:2px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .bar i.miss{background:var(--bad)}
  .empty{color:var(--dim);font-style:italic;padding:6px 0}

  .who{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;
    padding:5px 4px;border-bottom:1px solid #18222c;cursor:pointer;border-radius:3px}
  .who:hover{background:#16202b}
  .who canvas{display:block;background:#0d141b;border:1px solid var(--line);border-radius:3px}
  .who .nm{color:var(--ink)}
  .who .sub{color:var(--dim);font-size:11px}
  .who .at{font-size:11px}

  .card{border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0;
    background:var(--panel2)}
  .card.on{border-color:var(--acc)}
  .card h3{margin:0 0 3px;font-size:12px;color:var(--ink);font-weight:normal}
  .card .sub{color:var(--dim);font-size:11px}
  .tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:3px}
  .tbl th{text-align:left;color:var(--dim);font-weight:normal;padding:2px 3px;
    border-bottom:1px solid var(--line)}
  .tbl td{padding:2px 3px;border-bottom:1px solid #18222c;vertical-align:top}
  .tbl td.n{text-align:right;color:var(--dim)}
  .tbl tr.hot td{background:#1b1416}
  .g-block{color:var(--crit)} .g-hitl{color:var(--warn)} .g-log{color:var(--acc)}
  .lead{color:var(--dim);font-size:11px;margin:2px 0 5px}
  details{margin:3px 0}
  details summary{cursor:pointer;color:var(--acc);font-size:11px;outline:none;
    list-style:none;padding:1px 0}
  details summary::-webkit-details-marker{display:none}
  details summary:before{content:"▸ "}
  details[open] summary:before{content:"▾ "}
  .mono{font-size:11px;color:#9fb0c2;word-break:break-all}
  .jump{cursor:pointer;color:var(--acc)}

  footer{border-top:1px solid var(--line);background:var(--panel);padding:6px 14px;
    display:flex;align-items:center;gap:9px}
  footer input[type=range]{flex:1;accent-color:var(--acc);min-width:80px}
  #clock-label{min-width:250px;color:var(--dim);white-space:nowrap}
  #legend{position:absolute;left:10px;bottom:10px;background:rgba(7,10,14,.88);
    border:1px solid var(--line);border-radius:4px;padding:7px 9px;color:var(--dim);
    font-size:11px;max-width:60%;line-height:1.7}
  #legend b{color:var(--ink);font-weight:normal}
  #tip{position:absolute;pointer-events:none;background:rgba(7,10,14,.95);
    border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:11px;
    color:var(--ink);display:none;max-width:320px;line-height:1.6;z-index:5}
  #tip i{color:var(--dim);font-style:normal}
  #toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(7,10,14,.95);border:1px solid var(--line);border-radius:4px;
    padding:5px 11px;color:var(--dim);display:none}
  #zoombar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>the dawn of <b>AGI</b> · 픽셀 오피스</h1>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <span class="chip live" id="stat-busy">근무 <b>0</b></span>
    <span class="chip" id="stat-idle">대기 <b>0</b></span>
    <span class="chip" id="stat-cases">케이스 <b>0</b></span>
    <button id="btn-back">← 위로</button>
    <button id="btn-reload">새로고침</button>
  </header>

  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="zoombar">
        <button id="btn-zin">+</button>
        <button id="btn-zout">−</button>
        <button id="btn-fit">맞춤</button>
      </div>
      <div id="legend"></div>
      <div id="tip"></div>
      <div id="toast"></div>
    </div>
    <aside id="side"></aside>
  </main>

  <footer>
    <button id="cl-play" disabled>▶</button>
    <button id="cl-prev" disabled>⏮</button>
    <button id="cl-next" disabled>⏭</button>
    <input type="range" id="cl" min="0" max="0" value="0" disabled>
    <button id="cl-speed">보통</button>
    <button id="cl-now">지금</button>
    <span id="clock-label">오피스 시계 — 텔레메트리가 없으면 전원 대기실이다</span>
  </footer>
</div>

<script>
"use strict";
/* ────────────────────────────────────────────────────────────────────────
   픽셀 오피스 — 3D 아이소메트릭 사옥. 모든 픽셀이 텔레메트리에 바인딩된다.

   그리는 것은 전부 /api/state 에서 온다. 프론트가 만드는 값은 좌표뿐이다.

   빌딩 = 층(본부) × 섹터(존, 리스크 등급 순) + 지상 대기실.
   에이전트의 위치는 **오피스 시계 t 시점에 그 에이전트의 스팬이 있는가**로
   정해진다 (state.occupancy):

     · dawn.assets 가 있는 스팬  → 그 자산이 LOCATED_IN 한 섹터 안에 서 있다
     · 자산이 없는 스팬(chat 등) → 자기 자리(홈 섹터의 데스크)
     · 스팬이 없는 시각          → 대기실. 아무것도 안 하고 있다는 뜻이다

   걷기는 두 위치 사이의 보간일 뿐이다 — 목표가 바뀔 때만 움직인다. 가만히 있는
   에이전트는 한 픽셀도 흔들리지 않는다 (01_aoc: "장식 애니메이션 금지").
   ──────────────────────────────────────────────────────────────────────── */

/* ── 인코딩 표 (데이터 아님. 등급 ↔ 표현 매핑) ───────────────────────── */

/* 격자·층 치수. STEP 은 층 하나의 아이소 높이((Δx+Δy)·TH/2)보다 커야 한다 —
   작으면 위층이 아래층 뒷부분을 덮어 방이 사라진다. */
const G = { TW:44, TH:8, SW:4.8, SD:5, COR:1.8, GAP:1.1, TEAM:3, TEAMD:3.4, TROW:4,
            LOUNGE:6.5, CORE:2.4, STEP:200, WALL:34, SPEED:26, THF:20, RW:19, RD:13 };
/* 빌딩 뷰는 층을 쌓아야 하니 납작하게 본다(TH). 한 층만 볼 땐 쌓을 게 없으니
   카메라를 세워 방이 크게 보이게 한다(THF). 격자 좌표는 그대로다. */
const thNow = () => S.view === "building" ? G.TH : G.THF;
/* 잔글씨는 줌이 어느 정도 들어와야 그린다 — 전경에서 다 그리면 글자끼리 겹쳐
   아무것도 안 읽힌다. 빌딩 뷰는 '누가 어디 있나', 층 뷰는 '무엇이 있나'. */
const detail = () => S.cam.z >= 0.7;

const ZONE_TINT = { "외부/공개":"#33414f", "경유/검사":"#4d4230", "내부":"#2c4438",
                    "제한":"#2b3f56", "통제":"#4a2f3a" };
const SEV_COLOR = { critical:"#dc2626", high:"#ef4444", medium:"#f59e0b", low:"#22c55e" };
const EFFECT = {
  working:{ ring:"#22c55e", label:"작업" }, idle:{ ring:"#3d4a58", label:"대기" },
  alert:{ ring:"#ef4444", label:"경보" }, paused:{ ring:"#f59e0b", label:"일시중지" },
  isolated:{ ring:"#a855f7", label:"격리" }, killed:{ ring:"#dc2626", label:"종료" },
};
const HAT = { A0:{h:0.5,c:"#4b5563"}, A1:{h:0.9,c:"#2ab7a9"},
              A2:{h:1.3,c:"#3b82f6"}, A3:{h:1.8,c:"#a855f7"} };
const MODEL_C = { OPUS:"#a855f7", SONNET:"#3b82f6", HAIKU:"#22c55e", LOCAL:"#f59e0b" };
const IRR_C = { irreversible:"#dc2626", execute:"#f59e0b", write:"#3b82f6", read:"#5b6b7d" };
const GATE_C = { block:"#dc2626", require_hitl:"#f59e0b", log_only:"#2ab7a9" };
const KIND_FURN = { system:"rack", data:"cabinet", tool:"bench", mcp:"terminal" };
const HAIR = ["#2b2118","#5a3a22","#8a8f98","#3d2b4a"];
const SKIN = ["#e8c9a8","#d5ab84","#c08e63"];
const ACCENT = ["#f4d35e","#ef8354","#7ec8e3","#c3f584","#e5a0d0","#9db4ff","#f2a3a3","#8fe3c0"];
/* 시계는 실시간이 아니라 **이벤트 단위**로 간다. 도구 호출은 1ms, chat 은 5분이라
   실시간 배속으로는 섹터에 들어갔다 나오는 순간이 아예 안 보인다. 한 이벤트를
   몇 ms 동안 보여줄지가 SPEEDS 다 (시각 자체는 늘 진짜 타임스탬프다). */
const SPEEDS = [1600, 900, 450, 180];
const SPEED_NAME = ["느리게", "보통", "빠르게", "아주 빠르게"];

/* ── 런타임 홀더 — 비어서 시작한다 ────────────────────────────────────── */

const S = { state:null, view:"building", div:null, agent:null, plan:null, pos:{},
            sel:{kind:"", id:""}, room:{kind:"", id:""},
            clock:0, playing:false, speed:1, ev:[], ei:0, spans:[], hit:[], hover:null, tip:null,
            cam:{x:0,y:0,z:1}, drag:null, raf:0, last:0, moving:false };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const side = document.getElementById("side"), crumb = document.getElementById("crumb");
const cl = document.getElementById("cl"), clLabel = document.getElementById("clock-label");
const clPlay = document.getElementById("cl-play"), toast = document.getElementById("toast");
const tipEl = document.getElementById("tip"), stage = document.getElementById("stage");

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say = m => { toast.textContent = m; toast.style.display = "block";
                   clearTimeout(say._t); say._t = setTimeout(()=>toast.style.display="none", 2600); };
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a + (b-a)*t;

/* 같은 에이전트는 항상 같은 얼굴이다 — id 를 결정론적으로 접는다 (난수 아님). */
function hash32(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h = Math.imul(h ^ s.charCodeAt(i), 16777619); }
  return h >>> 0;
}
const hhms = ns => new Date(ns/1e6).toTimeString().slice(0,8);
const hm = ns => new Date(ns/1e6).toTimeString().slice(0,5);

/* ── 로딩 ─────────────────────────────────────────────────────────────── */

async function load(){
  const r = await fetch("/api/state", {cache:"no-store"});
  // 서버가 실패하면 그 이유를 그대로 올린다 — 응답 본문을 안 읽으면
  // "Unexpected token '<'" 같은 파싱 에러만 남아 원인을 못 찾는다.
  if(!r.ok){
    let why = "HTTP " + r.status;
    try{ const e = await r.json(); if(e && e.error) why += " — " + e.error; }catch(_){}
    throw new Error(why);
  }
  S.state = await r.json();
  S.plan = layout();
  buildEvents();
  if(!S.clock){ S.clock = S.state.now_ns || S.state.window.end_ns; S.ei = Math.max(0, S.ev.length-1); }
  S.pos = {};                                  // 위치는 시계가 다시 정한다
  syncSlider();
  applyTargets(true);
  fitCam();
  draw();
}

async function loadTrace(traceId){
  S.spans = [];
  if(!traceId) return;
  const r = await fetch("/api/trace/" + encodeURIComponent(traceId));
  if(!r.ok){ say("트레이스를 찾지 못했다: " + traceId); return; }
  S.spans = await r.json();
}

/* ── 평면도 — floorplan(서버) 을 격자 좌표로 편다 ─────────────────────── */

/* 한 층의 배치 (실제 사무실의 배치 그대로):

     뒤    존 섹터 — 리스크 등급 순으로 좌→우. 집기 = EG 자산.
     복도  섹터 사이의 문(pipe·PEP)이 여기 선다.
     앞    팀 데스크 아일랜드 — 본부의 팀 매니페스트 그대로. 자기 자리다.
     우측  휴게실 — 진행 중인 스팬이 없는 사람이 있는 방.

   섹터·팀·휴게실 어느 것도 임의로 만들지 않는다. 층 폭은 제일 넓은 층에 맞춘다
   (건물이니까 층마다 바닥 크기가 같다). 남는 바닥은 그냥 빈 바닥이다. */
function layout(){
  const fp = S.state.floorplan;
  const plans = fp.floors.map(f => {
    const teams = (S.state.divisions.find(d => d.division_id === f.division_id) || {}).teams || [];
    const secW = f.sectors.length*G.SW + Math.max(0, f.sectors.length-1)*G.GAP;
    const per = Math.min(teams.length, G.TROW);
    const teamW = per*G.TEAM + Math.max(0, per-1)*1.5;
    const trows = Math.max(1, Math.ceil(teams.length / G.TROW));
    return { f, teams, secW, teamW, trows };
  });
  const inner = Math.max(G.SW*2, ...plans.map(p => Math.max(p.secW, p.teamW)));
  const cols = G.CORE + 0.8 + inner + 1.6 + G.LOUNGE;
  const rows = G.SD + G.COR + Math.max(...plans.map(p => p.trows))*(G.TEAMD+0.5);
  const x0 = -0.6, x1 = cols + 0.6, y0 = -0.6, y1 = rows + 0.6;
  const base = G.CORE + 0.8;

  const levels = plans.map((p,i) => {
    const so = base + (inner - p.secW)/2, to = base + (inner - p.teamW)/2;
    return {
      kind:"floor", level:i, f:p.f, x0, x1, y0, y1, cols, rows,
      sectors: p.f.sectors.map((z,j) => ({
        z, x: so + j*(G.SW+G.GAP), y: 0, w: G.SW, d: G.SD })),
      teams: p.teams.map((t,j) => ({
        t, x: to + (j%G.TROW)*(G.TEAM+1.5), w: G.TEAM, d: G.TEAMD,
        y: G.SD + G.COR + Math.floor(j/G.TROW)*(G.TEAMD+0.5) })),
      lounge: { x: base + inner + 1.6, y: 0.5, w: G.LOUNGE, d: rows-1 },
      core: { x: 0, y: G.SD+0.4, w: G.CORE, d: rows-G.SD-0.4 },
    };
  });
  return { levels, cols, rows, x0, x1, y0, y1, info:fp.lounge };
}

const levelOfAgent = a =>
  Math.max(0, S.state.floorplan.floors.findIndex(f => f.division_id === a.division));
const levelByDiv = did =>
  Math.max(0, S.state.floorplan.floors.findIndex(f => f.division_id === did));
const sectorOf = (lv, short) => lv.sectors.find(s => s.z.short === short) || null;

/* ── 자리 배정 — 결정론. 같은 에이전트는 늘 같은 데스크에 앉는다 ─────── */

const agentsOnLevel = lv => S.state.agents.filter(a => a.division === lv.f.division_id);

function deskSlot(a){
  const lv = S.plan.levels[levelOfAgent(a)];
  const isl = lv.teams.find(t => t.t.team_id === a.team) || lv.teams[0];
  if(!isl) return { level:lv.level, gx:lv.cols/2, gy:G.SD+1 };
  const i = Math.max(0, isl.t.agents.indexOf(a.agent_id));
  return { level:lv.level, isl, desk:true,
           gx: isl.x + 0.75 + (i%2)*1.5, gy: isl.y + 2.5 + Math.floor(i/2)*0.1 };
}

function workSlot(a, zoneShort){
  const lv = S.plan.levels[levelOfAgent(a)];
  const sec = sectorOf(lv, zoneShort);
  if(!sec) return deskSlot(a);
  const i = hash32(a.agent_id) % 3;
  return { level:lv.level, sec, work:true,
           gx: sec.x + 1.3 + i*1.6, gy: sec.y + sec.d - 1.3 };
}

/* 대기실은 층마다 있다 — 자기 층에서 쉰다. 어느 본부가 놀고 있는지가 그대로 보인다. */
function loungeSlot(a){
  const lv = S.plan.levels[levelOfAgent(a)];
  const i = Math.max(0, agentsOnLevel(lv).findIndex(x => x.agent_id === a.agent_id));
  const lg = lv.lounge;
  return { level:lv.level, lounge:true,
           gx: lg.x + 1.4 + (i%3)*1.7, gy: lg.y + 1.6 + Math.floor(i/3)*1.9 };
}

/* ── 시계 → 목표 위치 (여기가 유일한 진실) ───────────────────────────── */

function segAt(agentId, t){
  const occ = S.state.occupancy;
  let best = null;
  for(const s of occ){
    if(s.agent_id !== agentId) continue;
    if(s.start_ns <= t && t < Math.max(s.end_ns, s.start_ns+1)){
      if(!best || s.start_ns >= best.start_ns) best = s;      // 겹치면 안쪽 스팬이 이긴다
    }
  }
  return best;
}

function targetOf(a, t){
  const seg = segAt(a.agent_id, t);
  if(!seg) return Object.assign(loungeSlot(a), { seg:null });
  const slot = seg.kind === "work" ? workSlot(a, seg.zone) : deskSlot(a);
  return Object.assign(slot, { seg });
}

/* 경로 — 방을 통과하지 않고 복도로 나왔다가 목표로 들어간다.
   에이전트는 자기 본부 층을 벗어나지 않으므로 층 이동은 없다. */
function pathTo(from, to){
  const corr = G.SD + G.COR/2, way = [];
  if(Math.abs(from.gx - to.gx) > 1.2){
    way.push({ level:from.level, gx:from.gx, gy:corr });
    way.push({ level:to.level, gx:to.gx, gy:corr });
  }
  way.push({ level:to.level, gx:to.gx, gy:to.gy });
  return way;
}

function applyTargets(snap){
  const t = S.clock;
  let moving = false;
  S.state.agents.forEach(a => {
    const tgt = targetOf(a, t);
    let p = S.pos[a.agent_id];
    if(!p){
      p = S.pos[a.agent_id] = { level:tgt.level, gx:tgt.gx, gy:tgt.gy, way:[], tgt };
    }
    const same = p.tgt && p.tgt.level === tgt.level &&
                 Math.abs(p.tgt.gx - tgt.gx) < 0.01 && Math.abs(p.tgt.gy - tgt.gy) < 0.01;
    p.seg = tgt.seg;
    if(same){ if(p.way.length) moving = true; return; }
    p.tgt = tgt;
    if(snap){ p.level = tgt.level; p.gx = tgt.gx; p.gy = tgt.gy; p.way = []; }
    else { p.way = pathTo(p, tgt); moving = true; }
  });
  S.moving = moving;
}

function advance(dt){
  let moving = false;
  for(const id in S.pos){
    const p = S.pos[id];
    if(!p.way.length) continue;
    let budget = G.SPEED * dt;
    while(budget > 0 && p.way.length){
      const n = p.way[0];
      if(n.level !== p.level){ p.level = n.level; p.gx = n.gx; p.gy = n.gy; p.way.shift(); continue; }
      const dx = n.gx - p.gx, dy = n.gy - p.gy, d = Math.hypot(dx, dy);
      if(d <= budget){ p.gx = n.gx; p.gy = n.gy; budget -= d; p.way.shift(); }
      else { p.gx += dx/d*budget; p.gy += dy/d*budget; budget = 0; }
    }
    if(p.way.length) moving = true;
  }
  S.moving = moving;
}

/* ── 아이소메트릭 기본 ────────────────────────────────────────────────── */

function fit(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = Math.max(1, r.width*dpr); cv.height = Math.max(1, r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { w:r.width, h:r.height };
}

/* 격자 → 화면. 카메라를 여기서 적용한다 → 모든 좌표가 곧 화면 좌표다(히트 판정 단순). */
function P(gx, gy, level, lift){
  const z = S.cam.z, th = thNow();
  const wx = (gx-gy)*G.TW/2;
  const wy = (gx+gy)*th/2 - level*G.STEP - (lift||0);
  return { x: wx*z + S.cam.x, y: wy*z + S.cam.y };
}

function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke(); }
}

function slab(gx, gy, w, d, level, lift, fill, stroke){
  const p = [P(gx,gy,level,lift), P(gx+w,gy,level,lift),
             P(gx+w,gy+d,level,lift), P(gx,gy+d,level,lift)];
  poly(p, fill, stroke);
  return p;
}

/* 상자 — 윗면 + 왼쪽면 + 오른쪽면. 집기와 벽은 전부 이걸로 만든다. */
function box(gx, gy, w, d, h, level, top, left, right, base){
  const b = base||0;
  const up = (x,y)=>P(x,y,level,b+h), dn = (x,y)=>P(x,y,level,b);
  poly([dn(gx,gy+d), dn(gx+w,gy+d), up(gx+w,gy+d), up(gx,gy+d)], left||"#222c38");
  poly([dn(gx+w,gy), dn(gx+w,gy+d), up(gx+w,gy+d), up(gx+w,gy)], right||"#1a232d");
  poly([up(gx,gy), up(gx+w,gy), up(gx+w,gy+d), up(gx,gy+d)], top||"#2c3a48");
}

function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n>>16)&255)*f, 0, 255)|0, g = clamp(((n>>8)&255)*f, 0, 255)|0;
  const b = clamp((n&255)*f, 0, 255)|0;
  return "rgb(" + r + "," + g + "," + b + ")";
}

function label(t, p, c, size, align, weight){
  ctx.fillStyle = c || "#d6e2f0"; ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.font = (weight||"") + " " + Math.max(8, size||11) + "px ui-monospace,Menlo,Consolas,monospace";
  ctx.fillText(t, p.x, p.y);
}

function inPoly(pts, x, y){
  let hit = false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const a = pts[i], b = pts[j];
    if(((a.y>y) !== (b.y>y)) && (x < (b.x-a.x)*(y-a.y)/(b.y-a.y) + a.x)) hit = !hit;
  }
  return hit;
}

/* ── 집기 — EG 자산 하나 = 집기 하나. 없으면 안 그린다 ────────────────── */

function furniture(kind, gx, gy, level, tint){
  const f = KIND_FURN[kind] || "cabinet";
  if(f === "rack"){
    box(gx, gy, 0.85, 0.85, 34, level, shade(tint,.9), "#141b23", "#0f151c");
    for(let i=0;i<4;i++){
      const p = P(gx+0.1, gy+0.85, level, 8+i*7);
      ctx.fillStyle = i%2 ? "#22c55e" : "#2ab7a9";
      ctx.fillRect(p.x, p.y, 4*S.cam.z, 2*S.cam.z);
    }
  } else if(f === "cabinet"){
    box(gx, gy, 1.15, 0.7, 20, level, shade(tint,.95), "#1b242e", "#151d26");
    const p = P(gx+0.15, gy+0.7, level, 9);
    ctx.fillStyle = "#3f4c5b"; ctx.fillRect(p.x, p.y, 10*S.cam.z, 2*S.cam.z);
  } else if(f === "bench"){
    box(gx, gy, 1.4, 0.8, 12, level, shade(tint,1.05), "#26313d", "#1d2731");
    box(gx+0.3, gy+0.2, 0.4, 0.3, 9, level, "#0f151c", "#0c1116", "#0a0e12", 12);
  } else {
    box(gx, gy, 0.8, 0.8, 14, level, shade(tint,1.1), "#1e2833", "#18202a");
    box(gx+0.1, gy+0.1, 0.55, 0.1, 11, level, "#0d1319", "#0b1016", "#090d11", 14);
  }
}

function desk(gx, gy, level, color){
  box(gx, gy, 1.7, 0.95, 11, level, "#6b5a48", "#4a3d31", "#3b3128");
  box(gx+0.55, gy+0.15, 0.55, 0.12, 12, level, "#111820", "#0d131a", "#0b1016", 11);
  const p = P(gx+0.6, gy+0.2, level, 22);
  ctx.fillStyle = shade(color, .8); ctx.fillRect(p.x, p.y, 9*S.cam.z, 6*S.cam.z);
  box(gx+0.25, gy+1.25, 0.55, 0.55, 7, level, "#2b3644", "#212a35", "#1a222b");
}

function plant(gx, gy, level){
  box(gx, gy, 0.45, 0.45, 6, level, "#5b4632", "#3f3021", "#33271b");
  const p = P(gx+0.22, gy+0.22, level, 15);
  ctx.fillStyle = "#2f7d4f"; ctx.beginPath();
  ctx.ellipse(p.x, p.y, 8*S.cam.z, 9*S.cam.z, 0, 0, Math.PI*2); ctx.fill();
}

/* ── 사람 — 유니폼·얼굴이 곧 신원이다 ─────────────────────────────────
   상의=본부색 · 깃/바지=팀 · 모자=자율화 · 명찰=모델 · 링=제어상태
   머리모양·머리색·안경·수염 = agent_id 결정론 해시 (개체 식별)          */

function person(g, a, cx, cy, s, opt){
  const o = opt || {};
  const h = hash32(a.agent_id);
  const skin = SKIN[(h>>>11) % SKIN.length];
  const hair = HAIR[(h>>>3) % HAIR.length];
  const style = h % 4, glasses = (h>>>7)&1, beard = (h>>>9)&1;
  const acc = ACCENT[hash32(a.team||a.agent_id) % ACCENT.length];
  const body = a.division_color || "#888888";
  const eff = EFFECT[a.effect] || EFFECT.idle;
  const rc = (x,y,w,hh,c)=>{ g.fillStyle=c; g.fillRect(Math.round(cx+x*s), Math.round(cy+y*s),
                                                     Math.max(1,Math.round(w*s)), Math.max(1,Math.round(hh*s))); };

  if(!o.flat){                                     // 바닥 그림자 + 상태 링
    g.fillStyle = "rgba(0,0,0,.34)";
    g.beginPath(); g.ellipse(cx, cy, 2.9*s, 1.25*s, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = eff.ring; g.lineWidth = Math.max(1, s*0.35);
    g.beginPath(); g.ellipse(cx, cy, 3.1*s, 1.35*s, 0, 0, Math.PI*2); g.stroke();
  }
  rc(-1.45,-2.6,1.1,2.6, shade(acc,.42));            // 다리 = 팀색 어둡게
  rc( 0.35,-2.6,1.1,2.6, shade(acc,.42));
  rc(-1.5,-0.25,1.3,0.35,"#10161d"); rc(0.3,-0.25,1.3,0.35,"#10161d");
  rc(-1.7,-6.3,3.4,3.8, body);                       // 상의 = 본부
  rc(-1.7,-6.3,3.4,0.55, acc);                       // 깃 = 팀
  rc(-0.12,-6.3,0.24,3.8, shade(body,.72));          // 여밈선
  rc(-2.5,-6.1,0.8,3.1, shade(body,.82));            // 팔
  rc( 1.7,-6.1,0.8,3.1, shade(body,.82));
  rc(-2.5,-3.2,0.8,0.7, skin); rc(1.7,-3.2,0.8,0.7, skin);
  if(a.badge) rc(0.55,-5.4,0.85,0.85, MODEL_C[a.badge] || "#4b5563");
  if(a.credentials_revoked) rc(-1.45,-5.4,0.8,0.8,"#dc2626");
  rc(-0.5,-6.75,1.0,0.5, skin);                      // 목
  rc(-1.35,-9.5,2.7,2.8, skin);                      // 머리
  rc(-0.72,-8.5,0.42,0.42,"#12161b"); rc(0.3,-8.5,0.42,0.42,"#12161b");   // 눈
  if(beard) rc(-0.75,-7.35,1.5,0.5, shade(hair,.8));
  if(glasses){
    g.strokeStyle = "#9fb0c2"; g.lineWidth = Math.max(1, s*0.16);
    g.strokeRect(Math.round(cx-0.95*s), Math.round(cy-8.7*s), 0.9*s, 0.75*s);
    g.strokeRect(Math.round(cx+0.12*s), Math.round(cy-8.7*s), 0.9*s, 0.75*s);
    rc(-0.06,-8.42,0.2,0.16,"#9fb0c2");
  }
  if(style === 0) rc(-1.35,-9.5,2.7,0.75, hair);                          // 짧은머리
  else if(style === 1){ rc(-1.35,-9.5,2.7,0.9, hair); rc(-1.7,-9.2,0.42,2.0, hair);
                        rc(1.3,-9.2,0.42,2.0, hair); }                    // 단발
  else if(style === 2){ rc(-1.35,-9.5,2.7,0.7, hair); rc(-1.0,-10.1,0.5,0.7, hair);
                        rc(-0.1,-10.3,0.5,0.9, hair); rc(0.7,-10.1,0.5,0.7, hair); }
  else { rc(-1.35,-9.5,2.7,0.8, hair); rc(-0.45,-10.6,0.95,0.95, hair); }  // 묶음
  const hat = HAT[a.hat] || HAT.A1;                                      // 모자 = 자율화
  rc(-1.6,-9.6-hat.h, 3.2, hat.h, hat.c);
  rc(-1.85,-9.72,3.7,0.34, shade(hat.c,.75));
  if(a.hat === "A3"){ rc(-0.1,-10.5-hat.h,0.2,0.8, hat.c); rc(-0.3,-11.4-hat.h,0.6,0.5, hat.c); }
  if(a.effect === "isolated" || a.effect === "killed"){
    g.strokeStyle = eff.ring; g.lineWidth = Math.max(1, s*0.3); g.globalAlpha = .75;
    g.beginPath(); g.moveTo(cx-2.6*s, cy-9.5*s); g.lineTo(cx+2.6*s, cy-0.4*s); g.stroke();
    g.globalAlpha = 1;
  }
}

/* ── 층 그리기 ────────────────────────────────────────────────────────── */

function drawLevel(lv, alpha){
  const al = alpha === undefined ? 1 : alpha;
  ctx.globalAlpha = al;
  const w = lv.x1 - lv.x0, d = lv.y1 - lv.y0;

  // 바닥판 (두께 있는 슬래브)
  box(lv.x0, lv.y0, w, d, 18, lv.level, "#151d26", "#0b1116", "#080d11", -18);
  slab(lv.x0, lv.y0, w, d, lv.level, 0, "#171f28", "#0d141b");

  // 뒤쪽 두 벽 — 낮게 잘라 안이 보이게 (돌하우스 컷어웨이)
  const wc = "#1f2a36";
  box(lv.x0, lv.y0-0.35, w, 0.35, G.WALL, lv.level, shade(wc,1.2), shade(wc,.82), shade(wc,.6));
  box(lv.x0-0.35, lv.y0, 0.35, d, G.WALL, lv.level, shade(wc,1.08), shade(wc,.74), shade(wc,.55));
  for(let i=1.2; i<w-1.2; i+=2.6){                              // 창
    const p = P(lv.x0+i, lv.y0-0.35, lv.level, G.WALL-6);
    ctx.fillStyle = "rgba(120,180,220,.15)";
    ctx.fillRect(p.x, p.y, 26*S.cam.z, 13*S.cam.z);
  }

  // 코어 — 계단·엘리베이터. 건물 뼈대다 (에이전트는 자기 층을 벗어나지 않는다).
  const co = lv.core;
  slab(co.x, co.y, co.w, co.d, lv.level, 0.5, "#1e2732", "#2b3644");
  box(co.x, co.y, co.w, 2.0, 46, lv.level, "#26323f", "#18212b", "#131a22");   // 엘리베이터
  box(co.x+0.25, co.y+2.0, co.w-0.5, 0.14, 34, lv.level, "#2ab7a9", "#1d8a80", "#166a62");
  for(let i=0;i<5;i++)                                                          // 계단
    box(co.x+0.3, co.y+3.0+i*0.55, co.w-0.6, 0.5, 4+i*3.5, lv.level,
        "#2a3542", "#1e2833", "#18202a");
  label("F" + (lv.level+1), P(co.x+co.w/2, co.y+1.0, lv.level, 54),
        "#8fa3b7", 11*Math.max(.85,S.cam.z));

  slab(lv.core.x, G.SD, lv.cols-G.LOUNGE-1.4, G.COR, lv.level, 0.35, "#1d2630", "#28323d");

  // 바닥은 **방·팀보다 먼저** 등록한다. 히트 판정은 나중 것이 위(그린 순서 = 깊이)라,
  // 바닥을 나중에 넣으면 방을 눌러도 바닥이 가로채 아무 일도 안 일어난다.
  S.hit.push({ poly:slab(lv.x0, lv.y0, w, d, lv.level, 0, null, null),
    go:()=>{ S.view="floor"; S.div=lv.f.division_id; S.agent=null; S.room={kind:"", id:""};
             S.sel = { kind:"floor", id:lv.f.division_id }; focusLevel(lv.level); draw(); },
    tip:()=>"<b>" + esc(lv.f.name) + "</b><br>run " + lv.f.runs + " · 스텝 " + lv.f.activity +
            "<br><i>클릭하면 이 층으로</i>" });

  drawSectors(lv, al);
  drawTeams(lv);
  drawLounge(lv);

  // 층 명패
  label(lv.f.name, P(lv.x0+0.4, lv.y0+0.2, lv.level, G.WALL+18), lv.f.color,
        13.5*Math.max(.8,S.cam.z), "left", "bold");
  label("zone:" + lv.f.zone + " · 섹터 " + lv.sectors.length + " · 팀 " + lv.teams.length +
        " · run " + lv.f.runs + " · 스텝 " + lv.f.activity,
        P(lv.x0+0.4, lv.y0+0.2, lv.level, G.WALL+3), "#5d6d7e",
        10.5*Math.max(.8,S.cam.z), "left");

  ctx.globalAlpha = 1;
}

/* 섹터 = 존. 리스크 등급이 높을수록 칸막이가 높고 색이 진하다. */
function drawSectors(lv, alpha){
  lv.sectors.forEach((sc,i) => {
    const z = sc.z;
    if(z.is_gate) return;               // pipe 는 방이 아니라 문이다 — drawGate 가 그린다
    const tint = ZONE_TINT[z.sensitivity] || "#26313d";
    const dim = z.used ? 1 : 0.42;              // 안 쓰는 존 — 빼면 없는 구역처럼 보인다
    ctx.globalAlpha = (alpha === undefined ? 1 : alpha) * dim;
    const pts = slab(sc.x, sc.y, sc.w, sc.d, lv.level, 0.5, tint, shade(tint,1.45));
    for(let g=1; g<sc.w; g++){                                  // 카펫 눈금
      const a = P(sc.x+g, sc.y, lv.level, 0.5), b = P(sc.x+g, sc.y+sc.d, lv.level, 0.5);
      ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    const rank = parseInt(String(z.security_level).replace(/[^0-9]/g,"") || "0", 10);
    const gc = ["#3d5a6b","#3f6b56","#4a5f86","#7a3f52"][clamp(rank,0,3)];
    const wh = 14 + rank*5;
    box(sc.x, sc.y-0.22, sc.w, 0.22, wh, lv.level, shade(gc,1.25), shade(gc,.82), shade(gc,.6));
    box(sc.x-0.22, sc.y, 0.22, sc.d, wh, lv.level, shade(gc,1.12), shade(gc,.76), shade(gc,.55));
    box(sc.x+sc.w, sc.y, 0.22, sc.d-1.8, wh, lv.level, shade(gc,1.02), shade(gc,.7), shade(gc,.5));

    // 명패 — 방 이름·CIDR·보안등급은 전부 EG Zone 노드에서 온다
    label(z.pixel_room, P(sc.x+sc.w/2, sc.y-0.22, lv.level, wh+22),
          "#cfdcea", 11.5*Math.max(.85,S.cam.z), "center", "bold");
    if(detail())
      label(z.cidr + " " + z.security_level, P(sc.x+sc.w/2, sc.y-0.22, lv.level, wh+2),
            "#6b7b8c", 9*S.cam.z);

    // 집기 = 자산. EG 에 있는 만큼만. 이름표는 **고른 방** 또는 충분히 당겼을 때만 —
    // 다 붙이면 아홉 개짜리 방에서 글자가 서로를 덮어 하나도 안 읽힌다.
    const named = (S.sel.kind === "sector" && S.sel.id === z.short) || S.cam.z >= 1.15;
    z.assets.forEach((as,j) => {
      const gx = sc.x + 0.4 + (j%3)*1.5, gy = sc.y + 0.35 + Math.floor(j/3)*1.15;
      if(gy > sc.y + sc.d - 2.0) return;
      const c = IRR_C[as.irreversibility] || "#5b6b7d";
      furniture(as.kind, gx, gy, lv.level, c);
      if(named)
        label(as.name, P(gx+0.4, gy+0.75, lv.level, 2 + (j%3)*9), shade(c, 1.55),
              9.5*Math.max(.9, S.cam.z));
    });
    if(detail() && z.assets.length)
      label("자산 " + z.assets.length + (z.entries ? " · 진입 " + z.entries + "회" : "") +
            (z.desk_spans ? " · 자리 " + z.desk_spans : ""),
            P(sc.x+sc.w/2, sc.y+sc.d-0.15, lv.level, 1), "#59697a", 9*S.cam.z);

    if(!z.used)
      label("미사용", P(sc.x+sc.w/2, sc.y+sc.d/2, lv.level, 8), "#5d6d7e",
            10*Math.max(.85,S.cam.z));
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;

    if(i < lv.sectors.length-1) drawGate(lv, sc);
    S.hit.push({ poly:pts, go:()=>{
        if(S.view === "building"){ S.view="floor"; S.div=lv.f.division_id; focusLevel(lv.level);
                                   S.sel = { kind:"sector", id:z.short }; draw(); return; }
        enterRoom("sector", z.short); },
      tip:()=>"<b>" + esc(z.pixel_room) + "</b> " + esc(z.short) + "<br>" +
              esc(z.sensitivity) + " · " + esc(z.security_level) + " · " + esc(z.cidr) +
              "<br><i>자산 " + z.assets.length + " · 이 층에서 진입 " + z.visits + "회</i>" });
  });
  if(!lv.sectors.length)
    label("배정된 섹터 없음", P(lv.cols/2, G.SD/2, lv.level, 20), "#4a5967", 12*S.cam.z);
}

/* 팀 데스크 아일랜드 = 조직 매니페스트의 팀. 자기 자리는 여기다. */
function drawTeams(lv){
  lv.teams.forEach(is => {
    const t = is.t, live = t.runs > 0;
    slab(is.x-0.2, is.y, is.w+0.4, is.d-0.4, lv.level, 0.45,
         live ? "#28343f" : "#212a34", "#384654");
    box(is.x-0.2, is.y, 0.16, is.d-0.4, 13, lv.level, "#3a4757", "#28323d", "#1f2831"); // 칸막이
    desk(is.x, is.y+1.4, lv.level, lv.f.color);                 // 두 자리
    desk(is.x+1.5, is.y+1.4, lv.level, lv.f.color);
    if(t.agents.length > 2) plant(is.x+2.5, is.y+0.4, lv.level);
    if(detail()){
      label(t.name, P(is.x+is.w/2, is.y+is.d-0.4, lv.level, 6),
            t.agents.length ? "#9fb0c2" : "#4d5b6a", 10*S.cam.z);
      if(live) label("run " + t.runs, P(is.x+is.w/2, is.y+is.d-0.4, lv.level, -6),
                     "#2ab7a9", 9*S.cam.z);
    }
    S.hit.push({ poly:slab(is.x-0.2, is.y, is.w+0.4, is.d-0.4, lv.level, 0.45, null, null),
      go:()=>{
        if(S.view === "building"){ S.view="floor"; S.div=lv.f.division_id; focusLevel(lv.level);
                                   S.sel = { kind:"team", id:t.team_id }; draw(); return; }
        enterRoom("team", t.team_id); },
      tip:()=>"<b>" + esc(t.name) + "</b> " + esc(t.team_id) + "<br>" +
              esc(t.eg_org) + " · zone:" + esc(t.zone) +
              "<br><i>에이전트 " + t.agents.length + " · run " + t.runs +
              " · 스텝 " + t.activity + "</i>" });
  });
}

/* pipe = 방이 아니라 섹터 사이의 문(PEP). 통과가 IPS 이벤트로 남는 지점이다. */
function drawGate(lv, sc){
  const g = (S.state.floorplan.gates || [])[0];
  if(!g) return;
  const gx = sc.x + sc.w + G.GAP/2 - 0.3, gy = G.SD - 2.6;
  box(gx, gy, 0.6, 0.3, 24, lv.level, "#5a4520", "#3d2f16", "#2e2411");
  box(gx, gy+1.5, 0.6, 0.3, 24, lv.level, "#5a4520", "#3d2f16", "#2e2411");
  if(detail()) label("▲ " + g.short, P(gx+0.3, gy+0.9, lv.level, 32), "#f59e0b", 10*S.cam.z);
  S.hit.push({ poly:[P(gx-0.4,gy,lv.level,0), P(gx+1.0,gy,lv.level,0),
                     P(gx+1.0,gy+1.9,lv.level,0), P(gx-0.4,gy+1.9,lv.level,0)],
    go:()=>{},
    tip:()=>"<b>" + esc(g.pixel_room) + "</b><br>" + esc(g.cidr) + " · " + esc(g.security_level) +
            "<br><i>존을 넘으면 이 문을 지난다 — 통과가 로그로 남는다</i>" });
}

/* 휴게실 — 층마다 하나. 스팬이 없는 사람이 여기 있다. */
function drawLounge(lv){
  const lg = lv.lounge;
  slab(lg.x, lg.y, lg.w, lg.d, lv.level, 0.5, "#232d38", "#33404d");
  box(lg.x-0.22, lg.y, 0.22, lg.d, 16, lv.level, "#33404d", "#232d38", "#1b232c");
  box(lg.x, lg.y-0.22, lg.w, 0.22, 16, lv.level, "#3a4757", "#28323d", "#1f2831");
  box(lg.x+0.6, lg.y+0.7, 2.6, 1.0, 12, lv.level, "#3a4a5c", "#2a3644", "#212b36");   // 소파
  box(lg.x+0.6, lg.y+0.35, 2.6, 0.4, 22, lv.level, "#44566a", "#31404f", "#26323e");
  box(lg.x+1.2, lg.y+2.2, 1.3, 1.0, 9, lv.level, "#5b4a38", "#3f3427", "#332a20");    // 테이블
  box(lg.x+1.6, lg.y+2.5, 0.3, 0.3, 6, lv.level, "#d6e2f0", "#a9b6c4", "#8b98a6", 9);
  box(lg.x+4.6, lg.y+0.5, 0.7, 0.7, 28, lv.level, "#2b3644", "#202932", "#1a212a");   // 정수기
  box(lg.x+4.7, lg.y+0.6, 0.5, 0.5, 8, lv.level, "#7ec8e3", "#5ea6c0", "#4a8ba3", 28);
  plant(lg.x+4.8, lg.y+lg.d-1.4, lv.level);
  label(S.plan.info.name, P(lg.x+lg.w/2, lg.y-0.22, lv.level, 30),
        "#9fb0c2", 10.5*Math.max(.85,S.cam.z), "center", "bold");
  S.hit.push({ poly:slab(lg.x, lg.y, lg.w, lg.d, lv.level, 0.5, null, null),
    go:()=>{
      if(S.view === "building"){ S.view="floor"; S.div=lv.f.division_id; focusLevel(lv.level); }
      S.sel = { kind:"lounge", id:lv.f.division_id }; draw(); },
    tip:()=>"<b>" + esc(S.plan.info.name) + "</b><br><i>" + esc(S.plan.info.note) + "</i>" });
}

/* ── 사람 배치 — 위치는 시계가 정한 것뿐 ──────────────────────────────── */

function drawPeople(lv, alpha){
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  const here = S.state.agents
    .map(a => ({ a, p:S.pos[a.agent_id] }))
    .filter(x => x.p && x.p.level === lv.level)
    .sort((u,v) => (u.p.gx+u.p.gy) - (v.p.gx+v.p.gy));

  here.forEach(({a,p}) => {
    const pt = P(p.gx, p.gy, p.level, 0.6);
    const s = 3.1 * S.cam.z;

    // 원격 조회 — 자리에 앉은 채 다른 방의 자산을 만지는 중이다. 게이트를 지나지
    // 않았으니 방으로 걸어가지 않는다. run 마다 두 번씩 일어나는 일이라 왕복시키면
    // 의미 있는 존 이동이 묻힌다. 대신 선으로 "어디에 손이 닿아 있는지"만 보인다.
    const seg0 = p.seg;
    if(seg0 && seg0.remote_zone){
      const sc = lv.sectors && lv.sectors.find(x => x.z.short === seg0.remote_zone);
      if(sc){
        const to = P(sc.x + sc.w/2, sc.y + sc.d - 0.6, lv.level, 6);
        ctx.strokeStyle = "#4a8ba3"; ctx.lineWidth = Math.max(1, 1.2*S.cam.z);
        ctx.globalAlpha = .55;
        ctx.beginPath(); ctx.moveTo(pt.x, pt.y - 14*S.cam.z); ctx.lineTo(to.x, to.y); ctx.stroke();
        ctx.globalAlpha = 1;
        if(S.cam.z > 0.6)
          label("원격 " + (seg0.tool || seg0.span),
                { x:(pt.x+to.x)/2, y:(pt.y+to.y)/2 - 6 }, "#7ec8e3", 9.5*S.cam.z);
      }
    }

    person(ctx, a, pt.x, pt.y, s);
    if(S.cam.z > 0.55){
      qualityBar(a.quality, pt.x - 11*S.cam.z, pt.y + 14*S.cam.z, 22*S.cam.z, 5*S.cam.z);
      label(a.name || a.agent_id, { x:pt.x, y:pt.y + 9*S.cam.z }, "#cfdcea", 10.5*S.cam.z);
      const seg = p.seg;
      const doing = seg ? (seg.kind === "work"
          ? (seg.tool || seg.span) + " → " + seg.zone
          : seg.remote_zone ? (seg.tool || seg.span) + " ⇢ " + seg.remote_zone + " 원격"
          : (seg.span === "chat" ? "생각 중 (chat)" : (seg.tool || seg.span)))
        : "대기";
      label(doing, { x:pt.x, y:pt.y + 20*S.cam.z },
            seg ? (GATE_C[seg.gate] || "#7d8fa3") : "#4a5967", 9.5*S.cam.z);
    }
    S.hit.push({ circle:{ x:pt.x, y:pt.y - 15*S.cam.z, r:17*S.cam.z },
      go:()=>{ S.view="desk"; S.agent=a.agent_id; S.div=a.division; loadTrace(a.last_trace).then(draw);
               focusLevel(p.level); draw(); },
      tip:()=>agentTip(a, p) });
  });
  ctx.globalAlpha = 1;
}

function agentTip(a, p){
  const seg = p.seg;
  const eff = EFFECT[a.effect] || EFFECT.idle;
  let s = "<b>" + esc(a.name || a.agent_id) + "</b><br>" +
          esc(a.team) + " · " + esc(a.autonomy) + " · " + esc(a.badge || "모델 미기록") +
          " · " + esc(eff.label) + "<br>";
  if(seg){
    s += "<i>" + esc(seg.span) + (seg.tool ? " " + esc(seg.tool) : "") + "</i><br>" +
         (seg.asset ? esc(seg.asset) + " @ " : "") +
         (seg.remote_zone ? esc(seg.remote_zone) + " (자기 자리에서 원격 — 게이트 미통과)"
                          : esc(seg.zone)) +
         (seg.gate ? " · gate=" + esc(seg.gate) : "") +
         "<br><i>" + hhms(seg.start_ns) + " → " + hhms(seg.end_ns) + "</i>";
  } else {
    s += "<i>진행 중인 스팬이 없다 — 대기실</i>";
  }
  if(a.quality){
    s += "<br><i>품질(judge " + esc(a.quality.judge_model || "") + ") " +
         QUALITY.axes.map(([k,ko]) => ko + " " + (a.quality[k]||0)).join(" · ") +
         " · " + esc(a.quality.verdict || "") + "</i>";
  } else if(a.runs){
    s += "<br><i>품질 판정 없음 — 실업무 run 이 아직 판정되지 않았다</i>";
  }
  return s;
}

/* ── 건물 기둥 — 층과 층을 잇는 뼈대 ──────────────────────────────────── */

function pillars(lv, up){
  const cs = [[lv.x0,lv.y0],[lv.x1,lv.y0],[lv.x1,lv.y1],[lv.x0,lv.y1]];
  ctx.globalAlpha = .72;
  cs.forEach(([gx,gy]) => {
    const a = P(gx, gy, lv.level, 0), b = P(gx, gy, up.level, -18);
    ctx.strokeStyle = "#243140"; ctx.lineWidth = Math.max(1.5, 5*S.cam.z);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

/* ── 뷰 1: 빌딩 (전 층 · 전 섹터 · 전 인원 한 화면) ───────────────────── */

function drawBuilding(w, h){
  const lvs = S.plan.levels;
  for(let i=lvs.length-1; i>=0; i--){          // 위층(먼 곳)부터 → 아래층이 덮는다
    if(i < lvs.length-1) pillars(lvs[i], lvs[i+1]);
    drawLevel(lvs[i]);
    drawPeople(lvs[i]);
  }
  const top = lvs[lvs.length-1];
  label("the dawn of AGI",
        P(top.x0 + (top.x1-top.x0)*0.62, top.y0-0.35, top.level, G.WALL+46),
        "#2ab7a9", 15*Math.max(.85,S.cam.z), "center", "bold");
  void w; void h;
}

/* ── 뷰 2: 플로어 (**그 층만**. 다른 층은 아예 그리지 않는다) ────────── */

function drawFloor(w, h){
  const lv = S.plan.levels[levelByDiv(S.div)];
  if(!lv) return;
  drawLevel(lv);
  drawPeople(lv);

  // 선택한 방·팀을 캔버스에서도 표시한다 — 오른쪽 상세와 눈이 맞아야 한다
  if(S.sel.kind === "sector"){
    const sc = lv.sectors.find(s => s.z.short === S.sel.id);
    if(sc) poly(slab(sc.x-0.25, sc.y-0.25, sc.w+0.5, sc.d+0.5, lv.level, 0.9, null, null),
                null, "#2ab7a9", 2);
  } else if(S.sel.kind === "team"){
    const is = lv.teams.find(t => t.t.team_id === S.sel.id);
    if(is) poly(slab(is.x-0.35, is.y-0.15, is.w+0.7, is.d-0.1, lv.level, 0.8, null, null),
                null, "#2ab7a9", 2);
  }

  floorHud(lv, w);

  const other = S.plan.levels.filter(x => x !== lv).map(x => x.f.name).join(" · ");
  label("다른 층: " + other + "  —  ← 위로(Esc) 로 사옥 전체",
        {x:14, y:h-14}, "#4a5967", 11, "left");
}

/* 층 머리말 — 업무·권한 요약. 오른쪽 상세를 읽기 전에 눈에 들어와야 한다. */
function floorHud(lv, w){
  const f = S.state.floorplan.floors[lv.level], wk = f.work, au = f.authority;
  const bx = 14, by = 12, bw = Math.min(560, w-28);
  ctx.fillStyle = "rgba(13,20,27,.9)"; ctx.fillRect(bx, by, bw, 79);
  ctx.strokeStyle = "#1e2a36"; ctx.lineWidth = 1;
  ctx.strokeRect(bx+.5, by+.5, bw-1, 78);
  ctx.fillStyle = f.color; ctx.fillRect(bx, by, 4, 79);

  label(f.name + "  F" + (lv.level+1), {x:bx+14, y:by+16}, "#d6e2f0", 13, "left", "bold");
  label("업무  실업무 " + wk.work_runs + "/" + wk.runs + "run · 완료 " + wk.complete +
        " · 도구 " + wk.tools.length + "종 · 토큰 " + wk.tokens.toLocaleString(),
        {x:bx+14, y:by+34}, "#9fb0c2", 11, "left");

  let x = bx+14;                                     // 게이트 판정 — 색이 곧 등급이다
  ["log_only", "require_hitl", "block"].forEach(k => {
    const n = wk.gate_decisions[k] || 0;
    if(!n) return;
    const t = k + " " + n;
    label(t, {x, y:by+51}, GATE_C[k], 11, "left");
    x += t.length*7 + 12;
  });
  const perm = "권한  실효 " + au.effective_union.length + "종 · deny " +
               au.deny_common.length + "종 · 최대 민감도 " + (au.max_sensitivity || "—");
  label(perm, {x:Math.max(x+8, bx+230), y:by+51}, "#7d8fa3", 11, "left");

  // 품질 — 권한·업무와 나란히 놓는다. 이 층 실업무 판정의 평균이다.
  const judged = S.state.agents.filter(a => a.division === f.division_id && a.quality);
  const avg = k => judged.length
    ? Math.round(judged.reduce((s2,a) => s2 + Number(a.quality[k]||0), 0) / judged.length) : 0;
  let qx = bx+14;
  label("품질", {x:qx, y:by+68}, "#9fb0c2", 11, "left"); qx += 32;
  if(judged.length){
    QUALITY.axes.forEach(([k,ko]) => {
      const v = avg(k);
      label(ko + " " + v, {x:qx, y:by+68}, qcolor(v), 11, "left");
      qx += (ko.length*11 + String(v).length*7 + 14);
    });
    label("판정 " + judged.length + "명", {x:qx, y:by+68}, "#5d6d7e", 11, "left");
  } else {
    label("판정 없음 — 실업무 run 이 아직 판정되지 않았다",
          {x:qx, y:by+68}, "#5d6d7e", 11, "left");
  }
  if(wk.blocked.length)
    label("차단 " + wk.blocked.join(" "), {x:bx+bw-12, y:by+16}, GATE_C.block, 11, "right");
}

/* ── 뷰 3: 룸 (방 하나 / 부서 자리 하나 — 안에서 무엇에 접근하는지) ─────
   빌딩·층 뷰는 "어디 있나"를 보여준다. 룸 뷰는 "무엇에 손을 대고 있나"를 본다.
   집기 = 자산이고, 사람은 자기가 만지는 집기 앞에 서서 선으로 이어진다.
   집기 종류로 성격을 구분한다: 서버랙 = system · 캐비닛 = data ·
   워크벤치 = tool · 터미널 = mcp · 금고 테 = 비가역.                       */

/* 화면 좌표 카드 — 벽에 글씨를 붙이면 아이소 평면에서 기울어 못 읽는다.
   집기·게시판 위에 카드로 띄운다. */
function card(pt, title, lines, accent, wide){
  const pad = 6, lh = 13, wpx = wide || 150;
  const hgt = 17 + lines.length*lh + pad;
  const x = pt.x - wpx/2, y = pt.y - hgt;
  ctx.fillStyle = "rgba(9,14,19,.93)"; ctx.fillRect(x, y, wpx, hgt);
  ctx.strokeStyle = accent || "#2b3644"; ctx.lineWidth = 1;
  ctx.strokeRect(x+.5, y+.5, wpx-1, hgt-1);
  ctx.fillStyle = accent || "#2ab7a9"; ctx.fillRect(x, y, 3, hgt);
  label(title, {x:x+pad, y:y+12}, "#d6e2f0", 11.5, "left", "bold");
  lines.forEach((t,i) => label(t[0], {x:x+pad, y:y+27+i*lh}, t[1] || "#9fb0c2", 10.5, "left"));
  return { x, y, w:wpx, h:hgt };
}

function roomShell(tint, note){
  const rw = G.RW, rd = G.RD;
  box(-0.7,-0.7, rw+1.4, rd+1.4, 18, 0, "#151d26", "#0b1116", "#080d11", -18);
  slab(-0.7,-0.7, rw+1.4, rd+1.4, 0, 0, "#1b232c", "#0d141b");
  slab(0, 0, rw, rd, 0, 0.5, tint, shade(tint,1.4));
  for(let g=2; g<rw; g+=2){
    const a = P(g,0,0,0.5), b = P(g,rd,0,0.5);
    ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  const wc = shade(tint, 1.25);
  box(0, -0.4, rw, 0.4, 62, 0, shade(wc,1.15), shade(wc,.8), shade(wc,.6));
  box(-0.4, 0, 0.4, rd, 62, 0, shade(wc,1.05), shade(wc,.72), shade(wc,.55));
  for(let i=1.5; i<rw-1; i+=3.2){                                   // 창
    const p = P(i, -0.4, 0, 40);
    ctx.fillStyle = "rgba(120,180,220,.13)";
    ctx.fillRect(p.x, p.y, 34*S.cam.z, 20*S.cam.z);
  }
  // 문 — 앞쪽 왼편. 이 방으로 들어오는 관문이다.
  box(-0.4, rd-2.6, 0.4, 2.2, 46, 0, "#2b3644", "#1e2833", "#18202a");
  box(-0.25, rd-2.5, 0.15, 2.0, 42, 0, "#3d4a58", "#2b3644", "#222c37");
  if(note) label(note, P(rw/2, rd+0.9, 0, 2), "#5d6d7e", 11*Math.max(.9,S.cam.z));
}

/* 비가역 자산은 금고처럼 테를 두른다 — 되돌릴 수 없는 것은 눈에 띄어야 한다. */
function assetPiece(as, gx, gy){
  const c = IRR_C[as.irreversibility] || "#5b6b7d";
  if(as.irreversibility === "irreversible"){
    box(gx-0.25, gy-0.25, 1.5, 1.5, 4, 0, "#2a1a1c", "#1d1214", "#170e10");
    const p = P(gx+0.5, gy+1.25, 0, 5);
    ctx.strokeStyle = "#dc2626"; ctx.lineWidth = Math.max(1, 1.5*S.cam.z);
    ctx.strokeRect(p.x-14*S.cam.z, p.y-6*S.cam.z, 28*S.cam.z, 8*S.cam.z);
  }
  furniture(as.kind, gx, gy, 0, c);
  return c;
}

const KIND_LABEL = { system:"서버랙", data:"캐비닛", tool:"워크벤치", mcp:"터미널" };
/* run 의 목적 — KPI 는 실업무만 센다. 드릴·레드팀은 일부러 막혀 ④ 에 도달하지
   않으므로 같이 세면 "잘 막혔다"가 "일을 못 한다"로 뒤집혀 읽힌다. */
/* 품질 3축 — LLM-judge 가 감시 대상과 **다른 모델**로 매긴다(담합 방지).
   근거(groundedness) · 완결성(completeness) · 경로(trajectory), 0~100.
   70 미만이면 fail 로 친다 (JudgeResult.failed 와 같은 기준). */
const QUALITY = { axes:[["groundedness","근거"], ["completeness","완결"], ["trajectory","경로"]],
                  pass:"#22c55e", warn:"#f59e0b", fail:"#ef4444", none:"#3d4a58" };
const PURPOSE = { work:{ label:"실업무", c:"#22c55e" }, drill:{ label:"드릴", c:"#3b82f6" },
                  redteam:{ label:"레드팀", c:"#ef4444" }, demo:{ label:"시연", c:"#a855f7" },
                  unknown:{ label:"미태그", c:"#5d6d7e" } };

function drawSectorRoom(w, h){
  const f = S.state.floorplan.floors[levelByDiv(S.div)];
  const z = f.sectors.find(s => s.short === S.room.id);
  if(!z){ label("방을 찾을 수 없다", {x:w/2,y:h/2}, "#7d8fa3", 13, "center"); return; }
  const tint = ZONE_TINT[z.sensitivity] || "#26313d";
  roomShell(tint, z.cidr + " · " + z.security_level + " · " + z.sensitivity);

  // 게시판 두 개 — 업무(선언)와 권한(컴파일된 실효 경계)
  const who = f.authority.agents.filter(a => (a.effective||[]).length);
  box(1.0, 0.35, 2.2, 0.3, 34, 0, "#243040", "#1a232e", "#151c25");
  card(P(2.1, 0.35, 0, 60), "업무 (L3 SOP)",
       z.works.length ? z.works.map(x => [x, "#8fb6dd"])
                      : [["도는 업무 없음", "#5d6d7e"]], "#3b5a7a", 190);
  box(G.RW-3.4, 0.35, 2.2, 0.3, 34, 0, "#243040", "#1a232e", "#151c25");
  card(P(G.RW-2.3, 0.35, 0, 60), "권한 (이 층 실효 경계)",
       who.length ? who.slice(0,3).map(a => [
         a.name + " · " + a.autonomy + " · 도구 " + a.effective.length +
         "종 / deny " + a.deny.length, "#9fb0c2"])
       : [["배치된 에이전트 없음", "#5d6d7e"]], "#3f5f45", 250);

  // 집기 = 자산. **손을 댄 자산만 카드**를 편다 — 전부 펴면 카드끼리 덮어
  // 하나도 안 읽힌다. 나머지는 이름표만 붙인다 (고르면 카드가 펴진다).
  const spots = {};
  z.assets.forEach((as,i) => {
    const gx = 1.5 + (i%3)*5.6, gy = 3.0 + Math.floor(i/3)*4.0;
    spots[as.id] = { gx, gy };
    const c = assetPiece(as, gx, gy);
    // 고른 자산만 카드를 편다. 나머지는 이름표 한 줄(+접촉 있으면 게이트 한 줄).
    // 전부 펴면 카드끼리 덮어 하나도 안 읽힌다.
    const sel = S.sel.kind === "asset" && S.sel.id === as.id;
    const gc = as.gate.block ? GATE_C.block
             : as.gate.require_hitl ? GATE_C.require_hitl
             : as.calls ? GATE_C.log_only : "#5d6d7e";
    let hitBox;
    if(sel){
      const lines = [[ (KIND_LABEL[as.kind]||as.kind) + " · " + as.irreversibility, c ]];
      if(as.calls){
        lines.push([as.tools.map(t => t.tool + " " + t.calls).join(", "), "#cfdcea"]);
        lines.push([Object.entries(as.gate).map(([k,v]) => k+" "+v).join(" · "), gc]);
        lines.push(["만진 사람 " + (as.agents.join(", ") || "—"), "#7d8fa3"]);
      } else {
        lines.push(["접촉 기록 없음 — 아무도 손대지 않았다", "#5d6d7e"]);
      }
      hitBox = card(P(gx+0.5, gy, 0, 42), as.name, lines, c, 230);
    } else {
      const nm = as.name.length > 14 ? as.name.slice(0,13) + "…" : as.name;
      const p = P(gx+0.5, gy, 0, 30);
      label(nm, p, as.calls ? shade(c,1.6) : "#6b7b8c", 10.5*Math.max(.9,S.cam.z));
      if(as.calls)
        label(as.tools[0].tool + " " +
              Object.entries(as.gate).map(([k,v]) => k+" "+v).join(" "),
              {x:p.x, y:p.y + 12*Math.max(.9,S.cam.z)}, gc, 9.5*Math.max(.9,S.cam.z));
      const half = Math.max(nm.length*4 + 8, 46);
      hitBox = { x:p.x-half, y:p.y-9, w:half*2, h:as.calls ? 30 : 18 };
    }
    S.hit.push({ poly:[{x:hitBox.x,y:hitBox.y}, {x:hitBox.x+hitBox.w,y:hitBox.y},
                       {x:hitBox.x+hitBox.w,y:hitBox.y+hitBox.h}, {x:hitBox.x,y:hitBox.y+hitBox.h}],
      go:()=>{ S.sel = { kind:"asset", id:as.id }; draw(); },
      tip:()=>"<b>" + esc(as.name) + "</b><br>" + esc(as.id) + " · " +
              esc(as.kind) + " · " + esc(as.irreversibility) +
              "<br><i>접촉 " + as.calls + "회 · 클릭하면 상세</i>" });
  });

  // 사람 — 지금 만지는 집기 앞에 서고, 그 집기와 선으로 이어진다.
  S.state.agents.filter(a => a.division === f.division_id).forEach((a,i) => {
    const seg = segAt(a.agent_id, S.clock);
    if(!seg || seg.kind !== "work" || seg.zone !== z.short) return;
    const sp = spots[seg.asset] || { gx: G.RW/2, gy: G.RD-2.5 };
    const pt = P(sp.gx + 0.5, sp.gy + 1.9 + (i%2)*0.7, 0, 0.5);
    const ap = P(sp.gx + 0.5, sp.gy + 0.5, 0, 12);
    ctx.strokeStyle = GATE_C[seg.gate] || "#2ab7a9";
    ctx.lineWidth = Math.max(1, 1.6*S.cam.z); ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y - 16*S.cam.z); ctx.lineTo(ap.x, ap.y); ctx.stroke();
    ctx.globalAlpha = 1;
    person(ctx, a, pt.x, pt.y, 3.6*S.cam.z);
    label(a.name, {x:pt.x, y:pt.y + 11*S.cam.z}, "#cfdcea", 11*S.cam.z);
    label(seg.tool + "  gate=" + (seg.gate||"-") + "  sev " + seg.severity,
          {x:pt.x, y:pt.y + 23*S.cam.z}, GATE_C[seg.gate] || "#7d8fa3", 10.5*S.cam.z);
    S.hit.push({ circle:{ x:pt.x, y:pt.y-18*S.cam.z, r:20*S.cam.z },
      go:()=>{ S.view="desk"; S.agent=a.agent_id; loadTrace(a.last_trace).then(draw); draw(); },
      tip:()=>agentTip(a, { seg }) });
  });

  const inside = S.state.agents.filter(a => {
    const s = segAt(a.agent_id, S.clock);
    return s && s.kind === "work" && s.zone === z.short;
  });
  if(!inside.length)
    label("지금 이 방에 있는 사람 없음 — ▶ 로 재생하면 들어오는 순간이 보인다",
          {x:w/2, y:h-26}, "#4a5967", 11.5, "center");
}

function drawTeamRoom(w, h){
  const f = S.state.floorplan.floors[levelByDiv(S.div)];
  const div = S.state.divisions.find(d => d.division_id === S.div) || { teams:[] };
  const t = div.teams.find(x => x.team_id === S.room.id);
  if(!t){ label("팀을 찾을 수 없다", {x:w/2,y:h/2}, "#7d8fa3", 13, "center"); return; }
  roomShell("#232d38", t.eg_org + " · zone:" + t.zone + " · 최대 민감도 " +
            (t.max_sensitivity || "—"));

  box(1.0, 0.35, 2.6, 0.3, 34, 0, "#243040", "#1a232e", "#151c25");
  card(P(2.3, 0.35, 0, 60), "팀 업무",
       [[t.mission || "미션 미기재", "#cfdcea"],
        ["업무 도메인 " + (t.work_domains.join(", ") || "—"), "#8fb6dd"],
        ["에스컬레이션 " + (t.escalation_to || "없음"), "#7d8fa3"]], "#3b5a7a", 260);

  const mine = f.authority.agents.filter(a => a.team === t.team_id);
  box(G.RW-3.8, 0.35, 2.6, 0.3, 34, 0, "#243040", "#1a232e", "#151c25");
  card(P(G.RW-2.5, 0.35, 0, 60), "팀 권한",
       mine.length ? [
         ["실효 도구 " + new Set(mine.flatMap(a => a.effective)).size + "종", "#8fd6a1"],
         ["deny " + new Set(mine.flatMap(a => a.deny)).size + "종", "#e5a0a0"],
         ["자율화 " + mine.map(a => a.autonomy).join(", "), "#9fb0c2"],
         ["모델 " + mine.map(a => a.model_policy).join(", "), "#9fb0c2"],
       ] : [["배치된 에이전트 없음 — 권한도 없다", "#5d6d7e"]], "#3f5f45", 250);

  // 데스크 = 사람 자리. 자리에 없으면 지금 어디 있는지 적는다.
  const roster = S.state.agents.filter(a => a.team === t.team_id);
  if(!roster.length)
    label("이 팀에는 아직 에이전트가 없다 — 조직은 있고 사람이 없다",
          P(G.RW/2, G.RD/2, 0, 14), "#5d6d7e", 12*Math.max(.9,S.cam.z));
  roster.forEach((a,i) => {
    const gx = 1.8 + (i%3)*5.8, gy = 4.8 + Math.floor(i/3)*4.2;
    desk(gx, gy, 0, a.division_color);
    box(gx+2.1, gy+0.1, 0.5, 0.5, 22, 0, "#2b3644", "#212a35", "#1a222b");   // 캐비닛
    const au = f.authority.agents.find(x => x.agent_id === a.agent_id) || {};
    const seg = segAt(a.agent_id, S.clock);
    card(P(gx+0.85, gy, 0, 36), a.name,
         [[a.autonomy + " · " + (a.badge || "모델 미기록") + " · " + (au.model_policy||""), "#9fb0c2"],
          ["도구 " + ((au.effective||[]).length) + "종 / deny " + ((au.deny||[]).length), "#8fd6a1"],
          [seg ? (seg.kind === "desk" ? "지금 자리에서 " + (seg.tool || seg.span)
                                      : "지금 " + seg.zone + " 섹터에 있다 — " + seg.tool)
               : "지금 휴게실 (업무 없음)",
           seg ? (seg.kind === "desk" ? "#2ab7a9" : GATE_C[seg.gate] || "#f59e0b") : "#5d6d7e"]],
         a.division_color, 240);
    if(seg && seg.kind === "desk"){
      const pt = P(gx+0.9, gy+2.0, 0, 0.5);
      person(ctx, a, pt.x, pt.y, 3.6*S.cam.z);
      S.hit.push({ circle:{ x:pt.x, y:pt.y-18*S.cam.z, r:20*S.cam.z },
        go:()=>{ S.view="desk"; S.agent=a.agent_id; loadTrace(a.last_trace).then(draw); draw(); },
        tip:()=>agentTip(a, { seg }) });
    } else {
      label(seg ? "자리 비움 — " + seg.zone + " 섹터" : "자리 비움 — 휴게실",
            P(gx+0.9, gy+2.0, 0, 8), seg ? "#f59e0b" : "#4a5967",
            10.5*Math.max(.9,S.cam.z));
    }
  });
  void w; void h;
}

function drawRoom(w, h){
  if(S.room.kind === "team") drawTeamRoom(w, h); else drawSectorRoom(w, h);
}

/* ── 뷰 4: 데스크 (에이전트 1명 — 실행 트레이스) ──────────────────────── */

function drawDesk(w, h){
  drawFloor(w, h);
  const a = S.state.agents.find(x => x.agent_id === S.agent);
  if(!a) return;
  const pad = 18, bw = Math.min(520, w-36), bh = Math.min(360, h-36);
  ctx.fillStyle = "rgba(7,10,14,.93)";
  ctx.fillRect(pad, h-bh-pad, bw, bh);
  ctx.strokeStyle = "#1e2a36"; ctx.lineWidth = 1;
  ctx.strokeRect(pad+.5, h-bh-pad+.5, bw-1, bh-1);

  S.hit.push({ poly:[{x:pad,y:h-bh-pad}, {x:pad+bw,y:h-bh-pad},
                     {x:pad+bw,y:h-pad}, {x:pad,y:h-pad}], go:()=>{} });

  const x0 = pad+16, y0 = h-bh-pad+22;
  label(a.name || a.agent_id, {x:x0,y:y0}, "#d6e2f0", 14, "left", "bold");
  label(a.team + " · " + a.eg_org + " · " + a.room, {x:x0,y:y0+18}, "#7d8fa3", 11, "left");
  person(ctx, a, x0+40, y0+140, 7, {flat:false});
  if(a.quality){
    qualityBar(a.quality, x0+14, y0+160, 54, 8);
    label(QUALITY.axes.map(([k,ko]) => ko + " " + (a.quality[k]||0)).join(" "),
          {x:x0+14, y:y0+178}, "#9fb0c2", 10, "left");
    label("judge " + (a.quality.judge_model || "") + " · " + (a.quality.verdict || ""),
          {x:x0+14, y:y0+192}, a.quality.verdict === "pass" ? QUALITY.pass : QUALITY.fail,
          10, "left");
    (a.quality.issues || []).slice(0,3).forEach((s2,i) =>
      label("· " + String(s2).slice(0,40), {x:x0+14, y:y0+208+i*13}, "#e5a0a0", 10, "left"));
  } else {
    label("품질 판정 없음", {x:x0+14, y:y0+178}, "#5d6d7e", 10, "left");
  }

  const bx = x0+100, by = y0+44;
  label("실행 트레이스 — 오피스 시계까지 벌어진 일", {x:bx,y:by-12}, "#7d8fa3", 11, "left");
  if(!S.spans.length){
    label("트레이스 없음 — 아직 실행한 적이 없다", {x:bx,y:by+14}, "#4a5967", 12, "left");
    return;
  }
  const shown = S.spans.filter(s => s.start_ns <= S.clock);
  const rows = Math.floor((bh - 92) / 19);
  const slice = shown.slice(Math.max(0, shown.length-rows));
  slice.forEach((s,i) => {
    const y = by + 14 + i*19, at = s.attributes || {};
    const gate = at["dawn.gate.decision"] || "";
    const live = s.start_ns <= S.clock && S.clock < Math.max(s.end_ns, s.start_ns+1);
    const c = s.status === "ERROR" ? "#ef4444" : (GATE_C[gate] || "#3d4a58");
    ctx.fillStyle = c; ctx.fillRect(bx, y-6, 4, 13);
    let t = s.name;
    if(s.name === "execute_tool") t = (at["gen_ai.tool.name"]||"?") + "   gate=" + (gate||"-");
    else if(s.name === "chat") t = "chat " + (at["gen_ai.request.model"]||"") +
      "  ↑" + (at["gen_ai.usage.input_tokens"]||0) + " ↓" + (at["gen_ai.usage.output_tokens"]||0);
    else if(s.name === "invoke_agent") t = "invoke_agent " + (at["gen_ai.agent.name"]||"");
    label(t, {x:bx+12,y}, live ? "#2ab7a9" : "#9fb0c2", 11.5, "left");
    label(hhms(s.start_ns), {x:bx+bw-124,y}, "#4a5967", 10.5, "left");
  });
}

/* ── 렌더 ─────────────────────────────────────────────────────────────── */

function draw(){
  if(!S.state) return;
  const {w,h} = fit();
  S.hit = [];
  ctx.fillStyle = "#070a0e"; ctx.fillRect(0,0,w,h);
  if(S.view === "building") drawBuilding(w,h);
  else if(S.view === "floor") drawFloor(w,h);
  else if(S.view === "room") drawRoom(w,h);
  else drawDesk(w,h);
  renderCrumb(); renderSide(); renderLegend(); renderStats();
}

function renderStats(){
  const busy = S.state.agents.filter(a => segAt(a.agent_id, S.clock)).length;
  document.getElementById("stat-busy").innerHTML = "근무 <b>" + busy + "</b>";
  document.getElementById("stat-idle").innerHTML =
    "대기 <b>" + (S.state.agents.length - busy) + "</b>";
  document.getElementById("stat-cases").innerHTML = "케이스 <b>" + S.state.cases.length + "</b>";
}

function renderCrumb(){
  const d = S.state.divisions.find(x => x.division_id === S.div);
  const a = S.state.agents.find(x => x.agent_id === S.agent);
  const parts = ['<a onclick="go(\'building\')">사옥</a>'];
  if(S.view !== "building" && d) parts.push('<a onclick="go(\'floor\')">' + esc(d.name) + "</a>");
  if(S.room.kind) parts.push('<a onclick="go(\'room\')">' + esc(roomTitle()) + "</a>");
  if(S.view === "desk" && a) parts.push(esc(a.name));
  crumb.innerHTML = "› " + parts.join(" › ");
}

function roomTitle(){
  const f = S.state.floorplan.floors[levelByDiv(S.div)];
  if(S.room.kind === "sector"){
    const z = (f.sectors||[]).find(s => s.short === S.room.id);
    return z ? z.pixel_room : S.room.id;
  }
  const div = S.state.divisions.find(x => x.division_id === S.div) || { teams:[] };
  const t = div.teams.find(x => x.team_id === S.room.id);
  return t ? t.name : S.room.id;
}

function renderLegend(){
  const el = document.getElementById("legend");
  const sw = c => '<span style="color:' + c + '">■</span>';
  if(S.view === "building"){
    el.innerHTML =
      "<b>층</b> = 본부 &nbsp; <b>섹터</b> = 존(리스크 등급 순, 칸막이가 높을수록 상급) &nbsp;" +
      "<b>지상</b> = 대기실<br>" +
      "<b>상의</b> = 본부 &nbsp; <b>깃·바지</b> = 팀 &nbsp; <b>모자</b> = 자율화 " +
      "(" + sw(HAT.A0.c) + "A0 " + sw(HAT.A1.c) + "A1 " + sw(HAT.A2.c) + "A2 " + sw(HAT.A3.c) + "A3) &nbsp;" +
      "<b>명찰</b> = 모델<br>" +
      "<b>발밑 링</b> = 제어 상태 &nbsp; 사람이 섹터 안에 있으면 <b>그 순간 거기서 실제로 도구를 쓴 것</b>이다";
  } else if(S.view === "floor"){
    el.innerHTML =
      "<b>집기</b> = EG 자산 · 색 = 비가역성 " + sw(IRR_C.irreversible) + "비가역" +
      sw(IRR_C.execute) + "실행" + sw(IRR_C.write) + "쓰기" + sw(IRR_C.read) + "읽기<br>" +
      "<b>주황 문</b> = pipe(PEP) — 존을 넘을 때 지난다 &nbsp; <b>데스크 섬</b> = 팀<br>" +
      "<b>방·팀·휴게실을 클릭</b>하면 오른쪽에 업무·권한 상세가 나온다";
  } else if(S.view === "room"){
    el.innerHTML =
      "<b>집기 = 자산</b> &nbsp; 서버랙=system · 캐비닛=data · 워크벤치=tool · 터미널=mcp " +
      "&nbsp; <b>붉은 테</b> = 비가역<br>" +
      "<b>사람에서 집기로 이어진 선</b> = 지금 그 자산에 손을 대고 있다는 뜻 · " +
      "선 색 = 게이트 판정 " + sw(GATE_C.block) + "block " + sw(GATE_C.require_hitl) + "HITL " +
      sw(GATE_C.log_only) + "log_only<br>" +
      "<b>왼쪽 게시판</b> = 업무(L3 SOP) &nbsp; <b>오른쪽 게시판</b> = 권한(실효 경계)";
  } else {
    el.innerHTML =
      "<b>얼굴</b>(머리·안경·수염) = agent_id 고정 해시 → 늘 같은 사람 &nbsp;" +
      "<b>막대</b> = " + sw(GATE_C.block) + "block " + sw(GATE_C.require_hitl) + "HITL " +
      sw(GATE_C.log_only) + "log_only";
  }
}

/* ── 사이드 패널 ──────────────────────────────────────────────────────── */

/* 층 상세 — 업무(실제로 돌아간 것)와 권한(할 수 있는 것)을 나란히 놓는다.
   둘을 떼어 놓으면 "권한은 있는데 안 쓴다 / 쓰는데 아슬아슬하다"가 안 보인다. */

const qcolor = v => v >= 90 ? QUALITY.pass : v >= 70 ? QUALITY.warn : QUALITY.fail;

/* 품질 막대 3칸 — 자율화 모자·모델 명찰 옆에 붙는 세 번째 인코딩 축이다.
   권한(무엇에 손댈 수 있나)과 나란히 품질(제대로 했나)이 보여야 한다. */
function qualityBar(q, x, y, w, h){
  if(!q){ ctx.fillStyle = QUALITY.none; ctx.fillRect(x, y, w, h); return; }
  const each = w/3;
  QUALITY.axes.forEach(([k], i) => {
    const v = Number(q[k] || 0);
    ctx.fillStyle = "#1b2632"; ctx.fillRect(x + i*each, y, each-1, h);
    ctx.fillStyle = qcolor(v);
    ctx.fillRect(x + i*each, y + h*(1 - clamp(v,0,100)/100), each-1, h*clamp(v,0,100)/100);
  });
}

const gcls = g => g === "block" ? "g-block" : g === "require_hitl" ? "g-hitl" : "g-log";
const gateSpan = obj => Object.entries(obj || {}).sort()
  .map(([k,v]) => '<span class="' + gcls(k) + '">' + esc(k) + " " + v + "</span>").join(" · ") || "—";
const toolTags = (list, cls, max) => (list || []).length
  ? (list.slice(0, max || 40).map(x => '<span class="tag ' + (cls||"") + '">' + esc(x) + "</span>").join("") +
     ((list.length > (max||40)) ? '<span class="muted">+' + (list.length-(max||40)) + "</span>" : ""))
  : '<span class="muted">없음</span>';

const toolTable = rows => rows.length
  ? '<table class="tbl"><tr><th>도구</th><th class="n">호출</th><th>행동</th>' +
    "<th>게이트</th></tr>" + rows.map(t =>
      '<tr class="' + (t.destructive ? "hot" : "") + '"><td>' + esc(t.tool) + "</td>" +
      '<td class="n">' + t.calls + "</td>" +
      '<td style="color:' + (IRR_C[t.action] || "#9fb0c2") + '">' + esc(t.action || "?") +
      (t.destructive ? '<br><span class="sev-critical">비가역</span>' : "") + "</td>" +
      "<td>" + gateSpan(t.gate) + "</td></tr>").join("") + "</table>"
  : '<div class="empty">호출 없음</div>';

function renderFloorDetail(){
  const idx = levelByDiv(S.div);
  const f = S.state.floorplan.floors[idx];
  if(!f) return "";
  const div = S.state.divisions.find(d => d.division_id === f.division_id) || { teams:[] };
  const wk = f.work, au = f.authority;
  let h = "";

  h += "<h2>" + esc(f.name) + " · F" + (idx+1) + "</h2>";
  h += kv({ "본부 존": "zone:" + f.zone, "섹터": f.sectors.map(s => s.short).join(" → "),
            "팀": div.teams.length, "에이전트": f.agents.length,
            "업무 도메인": au.work_domains.join(", ") || "—",
            "최대 민감도": au.max_sensitivity || "—" });

  // ── 선택한 대상 ─────────────────────────────────────────────────────
  if(S.sel.kind === "sector"){
    const z = f.sectors.find(s => s.short === S.sel.id);
    if(z){
      h += "<h2>" + esc(z.pixel_room) + (z.used ? "" : " <span class='muted'>· 미사용</span>") +
           "</h2>";
      h += kv({ "존": z.short, "대역": z.cidr, "보안등급": z.security_level,
                "민감도": z.sensitivity,
                "방에 들어온 횟수": z.entries + "회",
                "자기 자리 스팬": z.desk_spans + "건",
                "원격 접근": z.remote + "건",
                "상주 팀": (z.teams||[]).join(", ") || "없음",
                "상주 에이전트": (z.homed||[]).join(", ") || "없음" });
      if(!z.used)
        h += '<div class="lead">이 본부는 아직 이 존을 쓰지 않는다 — 존이 없는 게 아니라' +
             " 여기서 도는 업무가 없다는 뜻이다.</div>";

      h += "<h2>이 방의 업무</h2>";
      h += z.works.length
        ? '<div class="lead">여기 들어왔거나 이 존에 상주하는 에이전트가 맡은 L3 업무 ' +
          "SOP 다 (선언 기준 — 어느 호출이 어느 SOP 였는지는 스팬에 없다).</div>" +
          z.works.map(w => '<span class="tag pol">' + esc(w) + "</span>").join("")
        : '<div class="empty">이 방에서 도는 업무가 없다</div>';

      h += '<div class="lead">방 안에서 부른 도구 — 자산을 실제로 만졌다</div>';
      h += toolTable(z.tools);

      h += '<div class="lead">자기 자리에서 부른 도구 — 이 존을 홈으로 두지만' +
           " 방에 들어온 건 아니다.</div>";
      h += toolTable(z.desk_tools);

      h += '<div class="lead">원격 접근 ' + z.remote + "건 — 다른 자리에 앉은 채 " +
           "이 방의 자산을 만졌다. 액션 게이트를 지나지 않는 루프 필수 단계다 " +
           "(막으면 에이전트가 자기 작업을 기록하지 못한다).</div>";
      h += toolTable(z.remote_tools);

      h += '<div class="lead">방에 들어온 사람</div>';
      h += z.visitors.length ? z.visitors.map(v => '<div class="row">' + esc(v.name) +
        " <span class='muted'>" + v.calls + "회</span>" +
        '<div class="muted" style="font-size:11px">' + esc(v.team) + " · " +
        esc(v.works.join(", ") || "업무 미선언") + "</div></div>").join("")
        : '<div class="empty">아무도 들어오지 않았다' +
          (z.desk_spans ? " (자기 자리 스팬 " + z.desk_spans + "건은 진입이 아니다)" : "") +
          "</div>";

      h += '<div class="lead">방 안의 집기 = EG 자산 · 색 = 비가역성</div>';
      h += '<table class="tbl"><tr><th>자산</th><th>종류</th><th>비가역성</th></tr>' +
        z.assets.map(as => "<tr><td>" + esc(as.name) + '</td><td class="muted">' +
          esc(as.kind) + '</td><td style="color:' + (IRR_C[as.irreversibility]||"#5b6b7d") + '">' +
          esc(as.irreversibility) + "</td></tr>").join("") + "</table>";

      const been = S.state.occupancy.filter(s => s.zone === z.short && s.kind === "work" &&
        f.agents.indexOf(s.agent_id) >= 0);
      h += "<details><summary>진입 기록 " + been.length + "건</summary>" +
        (been.slice(-10).reverse().map(s =>
          '<div class="row"><span class="jump" onclick="jumpTo(' + s.start_ns + ')">' +
          hhms(s.start_ns) + "</span> " + esc(s.tool) +
          ' <span class="' + gcls(s.gate) + '">' + esc(s.gate || "-") + "</span>" +
          '<div class="muted" style="font-size:11px">' + esc(s.agent_id) + " · " +
          esc(s.asset) + "</div></div>").join("") || '<div class="empty">기록 없음</div>') +
        "</details>";
    }
  }

  if(S.sel.kind === "team"){
    const t = div.teams.find(x => x.team_id === S.sel.id);
    if(t){
      h += "<h2>팀 " + esc(t.name) + "</h2>";
      h += kv({ "ID": t.team_id, "EG 조직": t.eg_org, "존": t.zone,
                "기본 페르소나": t.persona_default || "—",
                "업무 도메인": t.work_domains.join(", ") || "—",
                "최대 민감도": t.max_sensitivity || "—",
                "에스컬레이션": t.escalation_to || "—",
                "run / 스텝": t.runs + " / " + t.activity });
      if(t.mission) h += '<div class="lead">' + esc(t.mission) + "</div>";
      if(!t.agents.length) h += '<div class="empty">배치된 에이전트 없음 — 팀은 있으나 아직 사람이 없다</div>';
    }
  }

  if(S.sel.kind === "lounge"){
    const idle = S.state.agents.filter(a => a.division === f.division_id &&
                                            !segAt(a.agent_id, S.clock));
    h += "<h2>" + esc(S.plan.info.name) + "</h2>";
    h += '<div class="lead">' + esc(S.plan.info.note) + "</div>";
    h += idle.length ? idle.map(a => '<div class="row">' + esc(a.name) +
      '<div class="muted" style="font-size:11px">마지막 run ' + a.runs +
      "회 · 근무 " + (a.busy_ms/1000).toFixed(1) + "초</div></div>").join("")
      : '<div class="empty">지금은 전원 근무 중</div>';
  }

  // ── 존별 업무 ───────────────────────────────────────────────────────
  h += "<h2>존별 업무 (리스크 등급 순)</h2>";
  h += '<div class="lead">방을 클릭하면 그 존의 도구·사람·자산까지 나온다.</div>';
  h += f.sectors.map(z => {
    const on = S.sel.kind === "sector" && S.sel.id === z.short;
    return '<div class="card' + (on ? " on" : "") + '" onclick="pickSel(\'sector\',\'' +
      esc(z.short) + '\')" style="cursor:pointer">' +
      "<h3>" + esc(z.pixel_room) + ' <span class="tag">' + esc(z.security_level) + "</span>" +
      (z.used ? "" : ' <span class="muted">미사용</span>') + "</h3>" +
      '<div class="sub">' + esc(z.sensitivity) + " · " + esc(z.cidr) +
      " · 자산 " + z.assets.length + " · 진입 " + z.entries + "회" +
      (z.desk_spans ? " · 자기 자리 " + z.desk_spans : "") +
      (z.remote ? " · 원격 " + z.remote : "") + "</div>" +
      (z.works.length
        ? '<div style="margin-top:3px">' +
          z.works.map(w => '<span class="tag pol">' + esc(w) + "</span>").join("") + "</div>"
        : '<div class="sub">도는 업무 없음</div>') +
      (z.tools.length
        ? '<div class="sub" style="margin-top:2px">' + z.tools.slice(0,4).map(t =>
            esc(t.tool) + " " + t.calls).join(" · ") +
          (z.tools.length > 4 ? " +" + (z.tools.length-4) : "") + "</div>"
        : "");
  }).join("");

  // ── 업무 ────────────────────────────────────────────────────────────
  h += "<h2>층 전체 업무 — 실제로 돌아간 것</h2>";
  h += kv({ "run": wk.runs + "건 · 실업무 " + wk.work_runs,
            "완료": wk.complete + "/" + wk.work_runs + " (실업무만)",
            "토큰": wk.tokens.toLocaleString(),
            "게이트 판정": "" });
  h += '<div style="margin:-4px 0 4px">' + Object.entries(wk.purposes).map(([k,v]) => {
    const p = PURPOSE[k] || PURPOSE.unknown;
    return '<span class="tag" style="color:' + p.c + ';border-color:' + p.c + '33">' +
           esc(p.label) + " " + v + "</span>";
  }).join("") + "</div>" +
  '<div class="lead">드릴·레드팀은 일부러 막혀 ④ 에 도달하지 않는다 — 완료율은 ' +
  "실업무만 센다. 섞어 세면 \"잘 막혔다\"가 \"일을 못 한다\"로 읽힌다.</div>";
  h += '<div style="margin:-4px 0 6px">' + gateSpan(wk.gate_decisions) + "</div>";
  if(wk.blocked.length)
    h += '<div class="row"><span class="sev-critical">차단된 도구</span> ' +
         toolTags(wk.blocked) + '<div class="muted" style="font-size:11px">' +
         "게이트가 실제로 막았다 — 권한 밖을 시도한 흔적이다</div></div>";
  h += '<table class="tbl"><tr><th>도구</th><th class="n">호출</th><th>행동</th>' +
       "<th>게이트</th></tr>" +
    (wk.tools.length ? wk.tools.map(t =>
      '<tr class="' + (t.destructive ? "hot" : "") + '"><td>' + esc(t.tool) +
      '<div class="muted">' + esc(t.zones.join(",")) + "</div></td>" +
      '<td class="n">' + t.calls + "</td>" +
      '<td style="color:' + (IRR_C[t.action] || "#9fb0c2") + '">' + esc(t.action || "?") +
      (t.destructive ? '<br><span class="sev-critical">비가역</span>' : "") +
      '<div class="muted">' + esc(t.risk) + "</div></td>" +
      "<td>" + gateSpan(t.gate) + "</td></tr>").join("")
      : '<tr><td colspan="4" class="muted">이 층에서 실행된 도구가 없다</td></tr>') + "</table>";
  h += '<div class="lead">만진 자산</div>' + toolTags(wk.assets, "asset");
  h += "<details><summary>최근 run " + wk.recent.length + "건</summary>" +
    wk.recent.map(r => '<div class="row"><span class="jump" onclick="jumpTo(' +
      r.started_ns + ')">' + hhms(r.started_ns) + "</span> " + esc(r.agent_id) +
      ' <span style="color:' + (PURPOSE[r.purpose] || PURPOSE.unknown).c + '">' +
      esc((PURPOSE[r.purpose] || PURPOSE.unknown).label) + "</span>" +
      (r.complete ? ' <span class="sev-low">완료</span>' : ' <span class="muted">미완</span>') +
      (r.status !== "OK" ? ' <span class="sev-high">' + esc(r.status) + "</span>" : "") +
      '<div class="muted" style="font-size:11px">' + esc(r.model || "모델 미기록") +
      " · 스텝 " + r.steps + " · " + esc(r.tools.join(" → ") || "도구 없음") +
      "</div></div>").join("") + "</details>";

  // ── 품질 ────────────────────────────────────────────────────────────
  h += "<h2>품질 — 시킨 대로·원칙대로 했나</h2>";
  const jd = S.state.agents.filter(a => a.division === f.division_id && a.quality);
  h += '<div class="lead">LLM-judge 가 <b>감시 대상과 다른 모델</b>로 매긴다(담합 방지). ' +
       "실업무 run 만 판정한다 — 드릴·레드팀은 일부러 실패하므로 채점 대상이 아니다.</div>";
  h += jd.length ? jd.map(a => {
    const q = a.quality;
    return '<div class="card"><h3>' + esc(a.name) +
      ' <span class="tag" style="color:' + (q.verdict === "pass" ? QUALITY.pass : QUALITY.fail) +
      '">' + esc(q.verdict || "?") + "</span></h3>" +
      '<div class="sub">judge ' + esc(q.judge_model || "") + " · 판정 " + a.judged + "회</div>" +
      QUALITY.axes.map(([k,ko]) =>
        '<div class="row" style="padding:2px 0">' + ko + ' <span class="muted">' +
        (q[k]||0) + '</span><div class="bar"><i style="width:' + clamp(q[k]||0,0,100) +
        "%;background:" + qcolor(q[k]||0) + '"></i></div></div>').join("") +
      ((q.issues||[]).length
        ? '<div class="lead">지적</div>' +
          q.issues.map(x => '<div class="muted" style="font-size:11px">· ' + esc(x) + "</div>").join("")
        : "");
  }).join("")
    : '<div class="empty">판정된 실업무 run 이 없다 — <code>dawn-aoc scan</code> 이 ' +
      "실업무를 돌 때 자동으로 판정한다</div>";

  // ── 권한 ────────────────────────────────────────────────────────────
  h += "<h2>권한 — 통제 평면이 정한 실효 경계</h2>";
  h += '<div class="lead">L1 COMPANY → L2 팀 → L3 업무 → L4 SOUL 을 겹쳐 병합한 값이다.' +
       " 하위는 <b>좁힐 수만</b> 있다 (allow 교집합 · deny 합집합 · autonomy 최솟값).</div>";
  h += kv({ "층 실효 도구": au.effective_union.length + "종",
            "공통 deny": au.deny_common.length + "종" });
  h += au.agents.length ? au.agents.map(x => {
    const on = S.sel.kind === "team" && S.sel.id === x.team;
    if(x.error) return '<div class="card"><h3>' + esc(x.name) + "</h3>" +
      '<div class="sev-high">컴파일 실패: ' + esc(x.error) + "</div></div>";
    const bud = x.budget || {};
    return '<div class="card' + (on ? " on" : "") + '"><h3>' + esc(x.name) +
      ' <span class="tag">' + esc(x.autonomy) + '</span><span class="tag">' +
      esc(x.model_policy) + "</span></h3>" +
      '<div class="sub">' + esc(x.team) + " · " + esc(x.agent_id) + "</div>" +
      '<div class="lead">쓸 수 있는 도구 ' + x.effective.length + "종</div>" +
      toolTags(x.effective, "asset", 12) +
      '<div class="lead">막힌 도구 (deny — 문장으로 못 넘는다)</div>' +
      toolTags(x.deny, "", 10) +
      '<div class="lead">사람 승인이 필요한 조건 ' + x.hitl_require_on.length + "개" +
      (x.amount_threshold_krw ? " · 금액 임계 " +
        Number(x.amount_threshold_krw).toLocaleString() + "원" : "") + "</div>" +
      toolTags(x.hitl_require_on, "pol", 12) +
      "<details><summary>예산 · 경계 출처 · 통제 문서</summary>" +
      kv({ "스텝": bud.max_steps, "도구 호출": bud.max_tool_calls,
           "토큰": (bud.max_tokens||0).toLocaleString(),
           "벽시계": (bud.max_wallclock_sec||0) + "초",
           "좁힌 계층": x.sources.join(" → "),
           "업무 SOP": x.works.join(", ") || "—" }) +
      '<div class="mono">' + x.layers.map(l => esc(l.level) + " " + esc(l.label)).join("<br>") +
      "</div></details></div>";
  }).join("") : '<div class="empty">이 층에 배치된 에이전트가 없다 — 권한도 없다</div>';

  // ── 이 층의 승인·케이스 ─────────────────────────────────────────────
  h += "<h2>이 층 승인 대기 (" + wk.hitl.length + ")</h2>";
  h += wk.hitl.length ? wk.hitl.map(x => '<div class="row">' + esc(x.skill) +
    ' <span class="muted">' + esc(x.status) + "</span>" +
    '<div class="muted" style="font-size:11px">' + esc(x.agent_id) + " · " +
    esc((x.reasons||[])[0] || "") + "</div></div>").join("")
    : '<div class="empty">대기 중 승인 없음</div>';

  h += "<h2>이 층 케이스 (" + wk.cases.length + ")</h2>";
  h += wk.cases.length ? wk.cases.map(c => '<div class="row"><span class="sev-' +
    c.severity + '">●</span> ' + esc(c.title.slice(0,50)) +
    '<div class="muted" style="font-size:11px">' + esc(c.axis) + " · 심각도 " +
    esc(c.severity_label) + "/" + c.severity_score + " · 권고 " +
    esc(c.recommended.join(", ") || "-") + "</div></div>").join("")
    : '<div class="empty">열린 케이스 없음</div>';

  return h;
}

window.pickSel = (kind, id) => { S.sel = { kind, id }; draw(); };
window.jumpTo = ns => {
  if(!S.ev.length) return;
  let i = S.ev.findIndex(e => e >= ns);
  gotoEvent(i < 0 ? S.ev.length-1 : i);
};

function renderSide(){
  const st = S.state;
  let html = "";

  if(S.view === "floor" || S.view === "room") html += renderFloorDetail();

  const roster = (S.view === "floor" || S.view === "room")
    ? st.agents.filter(a => a.division === S.div) : st.agents;
  html += "<h2>인원 (" + roster.length + ")</h2>";
  html += roster.map(a => {
    const seg = segAt(a.agent_id, S.clock);
    const eff = EFFECT[a.effect] || EFFECT.idle;
    const where = seg
      ? '<span style="color:' + (GATE_C[seg.gate] || "#2ab7a9") + '">' +
        esc(seg.kind === "work" ? seg.zone + " 섹터" : "자기 자리") + "</span> · " +
        esc(seg.tool || seg.span)
      : '<span class="muted">대기실 · 업무 없음</span>';
    return '<div class="who" data-agent="' + esc(a.agent_id) + '">' +
      '<canvas class="port" width="44" height="50"></canvas><div>' +
      '<div class="nm">' + esc(a.name || a.agent_id) +
      ' <span style="color:' + eff.ring + '">●</span></div>' +
      '<div class="sub">' + esc(a.team) + " · " + esc(a.autonomy) + " · " +
      esc(a.badge || "—") +
      (a.quality
        ? QUALITY.axes.map(([k]) => '<span style="color:' + qcolor(a.quality[k]||0) +
            '">●</span>').join("")
        : '<span class="muted"> ○○○</span>') + "</div>" +
      '<div class="at">' + where + "</div></div></div>";
  }).join("");

  if(S.view === "desk"){
    const a = st.agents.find(x => x.agent_id === S.agent);
    if(a){
      html += "<h2>에이전트</h2>";
      html += kv({ "ID":a.agent_id, "팀":a.team, "EG 조직":a.eg_org, "페르소나":a.persona,
                   "홈 존/방":a.zone + " · " + a.room,
                   "다녀온 섹터":(a.sectors||[]).join(", ") || "없음",
                   "자율화":a.autonomy + (a.autonomy !== a.autonomy_declared
                     ? " (선언 " + a.autonomy_declared + ")" : ""),
                   "모델":a.last_model || "—", "제어":a.control_state,
                   "근무시간":(a.busy_ms/1000).toFixed(1) + "s" });
      if(a.credentials_revoked) html += '<div class="sev-critical">자격증명 회수됨</div>';
      if(a.blocked_tools.length)
        html += '<div class="sev-high">차단 도구: ' + esc(a.blocked_tools.join(", ")) + "</div>";
      html += "<h2>실측</h2>" + kv({ "run":a.runs, "완료":a.complete,
                                     "토큰":a.tokens.toLocaleString(), "케이스":a.cases });
      html += "<h2>참조 중인 EG 노드</h2>";
      html += a.eg_refs.length
        ? a.eg_refs.map(r => '<span class="tag ' + (r.startsWith("pol:") ? "pol" : "asset") +
            '">' + esc(r) + "</span>").join("")
        : '<div class="empty">없음 — 아직 EG 노드를 건드리지 않았다</div>';
    }
  }

  html += "<h2>전사 KPI (실측)</h2>";
  html += st.kpis.map(k => {
    const ok = k.meets_target;
    const mark = ok === null ? '<span class="muted">표본 없음</span>'
               : ok ? '<span class="sev-low">충족</span>' : '<span class="sev-high">미달</span>';
    const pct = k.target ? Math.min(100, k.direction === "down"
                  ? (k.value <= k.target ? 100 : 100*k.target/Math.max(k.value,.001))
                  : 100*k.value/k.target) : 0;
    return '<div class="row"><div>' + esc(k.name) + ' <span class="muted">' +
      k.value.toFixed(1) + esc(k.unit) +
      (k.target !== null ? " / 목표 " + (k.direction === "down" ? "≤" : "≥") + k.target + esc(k.unit) : "") +
      "</span> " + mark + "</div>" +
      (k.target !== null ? '<div class="bar"><i class="' + (ok === false ? "miss" : "") +
        '" style="width:' + pct + '%"></i></div>' : "") +
      '<div class="muted" style="font-size:11px">n=' + k.sample +
      (k.note ? " · " + esc(k.note) : "") + "</div></div>";
  }).join("");

  html += "<h2>자율화 검토</h2>";
  html += st.autonomy_reviews.map(r => {
    const icon = r.demotion ? '<span class="sev-critical">⬇</span>'
               : r.eligible ? '<span class="sev-low">⬆</span>' : '<span class="muted">=</span>';
    return '<div class="row">' + icon + " " + esc(r.agent_id) + " <b>" + esc(r.current) + "</b>" +
      (r.proposed ? " → " + esc(r.proposed) : "") +
      '<div class="muted" style="font-size:11px">' + esc(r.reasons.join(" · ") || "유지") + "</div></div>";
  }).join("");

  html += "<h2>케이스 (" + st.cases.length + ")</h2>";
  html += st.cases.length ? st.cases.map(c =>
    '<div class="row"><span class="sev-' + c.severity + '">●</span> ' + esc(c.title.slice(0,52)) +
    '<div class="muted" style="font-size:11px">' + esc(c.agent_id) + " · " + esc(c.axis) +
    " · 심각도 " + esc(c.severity_label) + "/" + c.severity_score +
    " · 권고 " + esc(c.recommended.join(", ") || "-") + "</div>" +
    (c.actions.length ? '<div style="font-size:11px">' +
      c.actions.map(x => (x.executed ? "✔" : "✋") + " " + esc(x.playbook)).join(" · ") + "</div>" : "") +
    "</div>").join("")
    : '<div class="empty">열린 케이스 없음</div>';

  html += "<h2>제어 상태</h2>";
  html += st.control.length ? st.control.map(c =>
    '<div class="row">' + esc(c.agent_id) + ' <b class="' +
    (c.state === "running" ? "sev-low" : "sev-high") + '">' + esc(c.state) + "</b>" +
    '<div class="muted" style="font-size:11px">' + esc(c.reason || "") + "</div></div>").join("")
    : '<div class="empty">제어 개입 없음 (전원 running)</div>';

  html += "<h2>승인 대기 (HITL)</h2>";
  html += st.hitl.length ? st.hitl.slice(0,8).map(x =>
    '<div class="row">' + esc(x.skill) + ' <span class="muted">' + esc(x.status) + "</span>" +
    '<div class="muted" style="font-size:11px">' + esc(x.agent_id) + " · " +
    esc((x.reasons||[])[0] || "") + "</div></div>").join("")
    : '<div class="empty">대기 중 승인 없음</div>';

  side.innerHTML = html;

  // 명부 초상 — 사옥에 서 있는 사람과 **같은 인코딩**으로 그린다
  side.querySelectorAll(".who").forEach(el => {
    const a = st.agents.find(x => x.agent_id === el.dataset.agent);
    if(!a) return;
    const c = el.querySelector("canvas"), g = c.getContext("2d");
    g.clearRect(0,0,44,50);
    person(g, a, 22, 46, 3.6, {flat:true});
    el.onclick = () => { S.view = "desk"; S.agent = a.agent_id; S.div = a.division;
                         focusLevel((S.pos[a.agent_id]||{}).level || levelOfAgent(a));
                         loadTrace(a.last_trace).then(draw); draw(); };
  });
}

const kv = o => '<div class="kv">' + Object.entries(o).map(([k,v]) =>
  "<span>" + esc(k) + "</span><span>" + esc(v) + "</span>").join("") + "</div>";

/* ── 오피스 시계 ──────────────────────────────────────────────────────── */

/* 눈금 = 스팬의 시작·끝 시각. 여기 없는 시각에는 아무 일도 일어나지 않았다. */
