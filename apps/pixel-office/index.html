function buildEvents(){
  const set = {};
  S.state.occupancy.forEach(s => { set[s.start_ns] = 1; set[s.end_ns] = 1; });
  S.ev = Object.keys(set).map(Number).sort((a,b) => a-b);
  cl.max = Math.max(0, S.ev.length - 1);
  const on = S.ev.length > 1;
  cl.disabled = clPlay.disabled = !on;
  document.getElementById("cl-prev").disabled = !on;
  document.getElementById("cl-next").disabled = !on;
}

function gotoEvent(i){
  if(!S.ev.length) return;
  S.ei = clamp(i, 0, S.ev.length-1);
  cl.value = S.ei;
  setClock(S.ev[S.ei], false);
}

function syncSlider(){
  if(!S.ev.length){ clLabel.textContent = "오피스 시계 — 텔레메트리가 없다. 전원 대기실."; return; }
  const busy = S.state.agents.filter(a => segAt(a.agent_id, S.clock)).length;
  const prev = S.ei > 0 ? S.ev[S.ei] - S.ev[S.ei-1] : 0;
  const gap = prev >= 60e9 ? "+" + Math.round(prev/60e9) + "분"
            : prev >= 1e9 ? "+" + (prev/1e9).toFixed(1) + "초"
            : prev > 0 ? "+" + Math.round(prev/1e6) + "ms" : "";
  clLabel.textContent = hhms(S.clock) + "  ·  이벤트 " + (S.ei+1) + "/" + S.ev.length +
    (gap ? "  " + gap : "") + "  ·  근무 " + busy + "명  ·  " +
    hm(S.ev[0]) + "–" + hm(S.ev[S.ev.length-1]);
}

function setClock(ns, snap){
  S.clock = ns;
  applyTargets(!!snap);
  syncSlider();
  draw();
  if(!snap) ensureLoop();
}

function ensureLoop(){
  if(S.raf) return;
  S.last = performance.now();
  S.raf = requestAnimationFrame(tick);
}

function tick(ts){
  S.raf = 0;
  const dt = Math.min(0.1, (ts - S.last)/1000);
  S.last = ts;
  if(S.playing){
    S.dwell = (S.dwell || 0) + dt*1000;
    if(S.dwell >= SPEEDS[S.speed]){
      S.dwell = 0;
      if(S.ei >= S.ev.length-1){ S.playing = false; clPlay.textContent = "▶"; }
      else gotoEvent(S.ei + 1);
    }
  }
  advance(dt);
  draw();
  if(S.playing || S.moving) ensureLoop();
}

cl.addEventListener("input", () => {
  S.ei = clamp(+cl.value, 0, S.ev.length-1);
  setClock(S.ev[S.ei], true);
});
clPlay.addEventListener("click", () => {
  if(S.ei >= S.ev.length-1) gotoEvent(0);
  S.playing = !S.playing;
  S.dwell = 0;
  clPlay.textContent = S.playing ? "⏸" : "▶";
  ensureLoop();
});
document.getElementById("cl-prev").onclick = () => {
  S.playing = false; clPlay.textContent = "▶"; gotoEvent(S.ei - 1);
};
document.getElementById("cl-next").onclick = () => {
  S.playing = false; clPlay.textContent = "▶"; gotoEvent(S.ei + 1);
};
document.getElementById("cl-speed").onclick = () => {
  S.speed = (S.speed + 1) % SPEEDS.length;
  document.getElementById("cl-speed").textContent = SPEED_NAME[S.speed];
};
document.getElementById("cl-now").onclick = () => {
  S.playing = false; clPlay.textContent = "▶";
  S.ei = Math.max(0, S.ev.length-1); cl.value = S.ei;
  setClock(S.state.now_ns, true);
  say("지금 시각 — 진행 중인 스팬이 없으면 전원 휴게실이다");
};

/* ── 카메라 ───────────────────────────────────────────────────────────── */

function bounds(only){
  const lvs = only === undefined ? S.plan.levels : [S.plan.levels[only]];
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  const save = { x:S.cam.x, y:S.cam.y, z:S.cam.z };
  S.cam = { x:0, y:0, z:1 };
  lvs.forEach(lv => {
    [[lv.x0,lv.y0],[lv.x1,lv.y0],[lv.x1,lv.y1],[lv.x0,lv.y1]].forEach(([gx,gy]) => {
      [0, G.WALL+60].forEach(lift => {
        const p = P(gx,gy,lv.level,lift);
        x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y);
      });
    });
  });
  S.cam = save;
  return { x0, y0, x1, y1 };
}

function frame(b, padX, padY, lo, hi){
  const r = cv.getBoundingClientRect();
  const z = clamp(Math.min((r.width-padX)/(b.x1-b.x0), (r.height-padY)/(b.y1-b.y0)), lo, hi);
  S.cam.z = z;
  S.cam.x = r.width/2 - (b.x0+b.x1)/2*z;
  S.cam.y = r.height/2 - (b.y0+b.y1)/2*z;
}
const fitCam = () => frame(bounds(), 70, 50, 0.22, 2.4);
function roomBounds(){
  const save = { x:S.cam.x, y:S.cam.y, z:S.cam.z };
  S.cam = { x:0, y:0, z:1 };
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  [[-0.7,-0.7],[G.RW+0.7,-0.7],[G.RW+0.7,G.RD+0.7],[-0.7,G.RD+0.7]].forEach(([gx,gy]) => {
    [0, 96].forEach(lift => { const p = P(gx,gy,0,lift);
      x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); });
  });
  S.cam = save;
  return { x0, y0, x1, y1 };
}
function enterRoom(kind, id){
  S.view = "room"; S.room = { kind, id }; S.agent = null;
  S.sel = { kind, id };
  frame(roomBounds(), 90, 110, 0.3, 2.6);
  draw();
}
const focusLevel = level => frame(bounds(clamp(level, 0, S.plan.levels.length-1)),
                                  80, 90, 0.3, 2.4);

function zoomAt(f, mx, my){
  const r = cv.getBoundingClientRect();
  const cxp = mx === undefined ? r.width/2 : mx, cyp = my === undefined ? r.height/2 : my;
  const nz = clamp(S.cam.z*f, 0.22, 3);
  S.cam.x = cxp - (cxp - S.cam.x) * (nz/S.cam.z);
  S.cam.y = cyp - (cyp - S.cam.y) * (nz/S.cam.z);
  S.cam.z = nz;
  draw();
}

document.getElementById("btn-zin").onclick = () => zoomAt(1.25);
document.getElementById("btn-zout").onclick = () => zoomAt(0.8);
document.getElementById("btn-fit").onclick = () => { fitCam(); draw(); };

cv.addEventListener("wheel", e => { e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX-r.left, e.clientY-r.top);
}, {passive:false});

cv.addEventListener("mousedown", e => {
  S.drag = { x:e.clientX, y:e.clientY, cx:S.cam.x, cy:S.cam.y, moved:0 };
  cv.classList.add("drag");
});
addEventListener("mouseup", e => {
  if(S.drag && S.drag.moved < 5) clickAt(e);
  S.drag = null; cv.classList.remove("drag");
});
addEventListener("mousemove", e => {
  if(S.drag){
    S.drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
    S.cam.x = S.drag.cx + (e.clientX - S.drag.x);
    S.cam.y = S.drag.cy + (e.clientY - S.drag.y);
    draw();
    return;
  }
  hoverAt(e);
});

/* ── 히트 판정 ────────────────────────────────────────────────────────── */

/* 그린 순서가 곧 깊이다 — 나중에 그린 것이 위에 있다. 뒤에서부터 첫 명중을 쓴다.
   (층은 위층→아래층 순으로 그리므로 앞에 있는 아래층이 자연히 이긴다.) */
function pick(e){
  const r = cv.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
  if(x < 0 || y < 0 || x > r.width || y > r.height) return null;
  for(let i=S.hit.length-1; i>=0; i--){
    const t = S.hit[i];
    const ok = t.circle
      ? Math.hypot(x-t.circle.x, y-t.circle.y) <= t.circle.r
      : inPoly(t.poly, x, y);
    if(ok) return t;
  }
  return null;
}

function clickAt(e){
  const t = pick(e);
  if(t && t.go) t.go();
}

function hoverAt(e){
  const t = pick(e);
  if(!t || !t.tip){ tipEl.style.display = "none"; S.tip = null; return; }
  const html = t.tip();
  if(html !== S.tip){ tipEl.innerHTML = html; S.tip = html; }
  const r = stage.getBoundingClientRect();
  tipEl.style.display = "block";
  tipEl.style.left = clamp(e.clientX - r.left + 14, 4, r.width - tipEl.offsetWidth - 8) + "px";
  tipEl.style.top = clamp(e.clientY - r.top + 14, 4, r.height - tipEl.offsetHeight - 8) + "px";
}

cv.addEventListener("mouseleave", () => { tipEl.style.display = "none"; S.tip = null; });

/* ── 네비게이션 ───────────────────────────────────────────────────────── */

window.go = v => {
  if(v === "building"){ S.view = "building"; S.agent = null; S.spans = [];
                        S.sel = {kind:"", id:""}; fitCam(); }
  if(v === "floor"){ S.view = "floor"; S.agent = null; S.spans = [];
                     S.sel = {kind:"floor", id:S.div}; S.room = {kind:"", id:""};
                     focusLevel(levelByDiv(S.div)); }
  if(v === "room" && S.room.kind) enterRoom(S.room.kind, S.room.id);
  draw();
};
document.getElementById("btn-back").onclick = () =>
  go(S.view === "desk" ? (S.room.kind ? "room" : "floor")
   : S.view === "room" ? "floor" : "building");
document.getElementById("btn-reload").onclick = async () => { await load(); say("상태 갱신됨"); };
addEventListener("resize", () => draw());
addEventListener("keydown", e => {
  if(e.key === "Escape") document.getElementById("btn-back").click();
  if(e.key === " " && !clPlay.disabled){ e.preventDefault(); clPlay.click(); }
  if(e.key === "+" || e.key === "=") zoomAt(1.2);
  if(e.key === "-") zoomAt(0.83);
  if(e.key === "s") document.getElementById("cl-speed").click();
  if(e.key === "ArrowLeft" && !cl.disabled) document.getElementById("cl-prev").click();
  if(e.key === "ArrowRight" && !cl.disabled) document.getElementById("cl-next").click();
});

load().catch(err => {
  side.innerHTML = "<h2>상태를 못 읽었다</h2>" +
    '<div class="empty">' + esc(err.message) + "</div>" +
    '<div class="muted">서버가 떠 있는데도 이 화면이면 <b>매니페스트·스키마를 고친 뒤 ' +
    '재기동을 안 한 것</b>일 수 있다 (검증기는 프로세스마다 캐시된다).<br>' +
    "<code>make office-stop &amp;&amp; make office-bg</code> · 로그: <code>var/aoc/serve.log</code></div>";
  say("상태 API 실패 — " + err.message);
});
</script>
</body>
